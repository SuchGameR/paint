<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VersePaint</title>
  <link rel="icon" type="image/png" href="./versepaint-logo.png">
  <link rel="stylesheet" href="./js/vp-chrome.css">
  <style>
    html, body { margin:0; height:100%; background:#0b0b0b; color:#aaa; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    #boot { display:grid; place-items:center; height:100%; gap:8px; font-size:14px; }
    #boot small { opacity:.6; font-size:12px; }
  </style>
</head>
<body>
  <div id="boot">
    <div>新UIを読み込み中…</div>
    <small>エンジン接続 · パネル準備</small>
  </div>
  <script>
  (function () {
    function fail(msg) {
      var b = document.getElementById('boot');
      if (b) b.innerHTML = '<div style="color:#f88">' + (msg || '読み込み失敗') + '</div>';
    }
    function send(msg) {
      var f = document.getElementById('engine-frame');
      if (f && f.contentWindow) {
        f.contentWindow.postMessage(Object.assign({ source: 'verse-new-ui' }, msg), '*');
      }
    }
    if (location.protocol === 'file:') {
      fail('ローカルサーバーで開いてください。<br><small>例: このフォルダで <code>python -m http.server</code> を実行し http://localhost:8000/ を開く</small>');
      return;
    }
    function wireUi() {
      document.querySelectorAll('.tool-button[data-tool]').forEach(function (btn) {
        if (btn.__vpWired) return;
        btn.__vpWired = true;
        btn.addEventListener('click', function () {
          document.querySelectorAll('.tool-button[data-tool]').forEach(function (b) {
            b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
          });
          send({ type: 'tool', tool: btn.getAttribute('data-tool') });
        });
      });
      document.addEventListener('click', function (e) {
        var sw = e.target.closest('.swatch, [data-color], .recent-color');
        if (!sw) return;
        var c = sw.getAttribute('data-color') || sw.getAttribute('data-swatch') || getComputedStyle(sw).backgroundColor;
        if (c && c !== 'transparent' && c !== 'rgba(0, 0, 0, 0)') send({ type: 'color', color: c });
      });
      ['quick-brush-size-range', 'quick-brush-size-number', 'quick-eraser-size-range', 'brush-size'].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', function () { send({ type: 'brushSize', size: el.value }); });
      });
      var modeVec = document.getElementById('draw-mode-vector');
      var modePaint = document.getElementById('draw-mode-paint');
      function setModeUi(m) {
        var isPaint = m === 'paint';
        if (modeVec) { modeVec.classList.toggle('active', !isPaint); modeVec.setAttribute('aria-pressed', String(!isPaint)); }
        if (modePaint) { modePaint.classList.toggle('active', isPaint); modePaint.setAttribute('aria-pressed', String(isPaint)); }
      }
      window.__vpSetModeUi = setModeUi;
      if (modeVec) modeVec.addEventListener('click', function () {
        send({ type: 'api', method: 'click', id: 'mode-vector-btn' });
        setModeUi('vector');
      });
      if (modePaint) modePaint.addEventListener('click', function () {
        send({ type: 'api', method: 'click', id: 'mode-paint-btn' });
        setModeUi('paint');
      });
      var appearanceSent = false;
      function pushAppearance() {
        if (appearanceSent) return;
        appearanceSent = true;
        var pal = document.getElementById('palette-color');
        send({ type: 'tool', tool: 'brush' });
        send({ type: 'color', color: (pal && pal.value) || '#ff6600' });
        var sizeEl = document.getElementById('quick-brush-size-number') || document.getElementById('brush-size');
        send({ type: 'brushSize', size: (sizeEl && sizeEl.value) || 16 });
      }
      var palIn = document.getElementById('palette-color');
      if (palIn) palIn.addEventListener('input', function () { send({ type: 'color', color: palIn.value }); });
      window.addEventListener('message', function (ev) {
        if (!ev.data || ev.data.source !== 'verse-engine') return;
        if (ev.data.type === 'ready' || ev.data.type === 'pong') {
          pushAppearance();
        } else if (ev.data.type === 'brushSize') {
          var n = ev.data.size;
          ['quick-brush-size-range', 'brush-size'].forEach(function (id) {
            var el = document.getElementById(id);
            if (el) el.value = n;
          });
          var num = document.getElementById('quick-brush-size-number');
          if (num) num.value = n;
        } else if (ev.data.type === 'state') {
          setModeUi(ev.data.mode);
        }
      });
      setTimeout(function () { send({ type: 'ping' }); }, 1200);
    }
    function loadScripts() {
      wireUi();
      ['draw-ui-integrate.js', 'draw-panels.js', 'draw-menu-nest.js', 'draw-icons.js'].forEach(function (src) {
        var s = document.createElement('script');
        s.src = './js/' + src;
        document.body.appendChild(s);
      });
    }
    fetch('./new-ui.html', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('new-ui.html HTTP ' + r.status);
        return r.text();
      })
      .then(function (html) {
        var iframe =
          '<iframe id="engine-frame" src="./draw-engine.html" title="キャンバス" ' +
          'style="width:100%;height:100%;border:0;display:block;background:#3a3a3a;border-radius:inherit;touch-action:none;"></iframe>';
        if (/<div class="canvas" id="canvas">\s*<\/div>/.test(html)) {
          html = html.replace(
            /<div class="canvas" id="canvas">\s*<\/div>/,
            '<div class="canvas" id="canvas" style="position:relative;overflow:hidden;z-index:1;">' + iframe + '</div>'
          );
        } else if (html.indexOf('id="canvas"') >= 0) {
          html = html.replace(/(id="canvas"[^>]*>)/, '$1' + iframe);
        } else {
          throw new Error('new-ui.html に #canvas がありません');
        }
        var parsed = new DOMParser().parseFromString(html, 'text/html');
        document.head.innerHTML = parsed.head.innerHTML;
        document.body.innerHTML = parsed.body.innerHTML;
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = './js/vp-chrome.css';
        document.head.appendChild(link);
        Array.prototype.slice.call(document.body.querySelectorAll('script')).forEach(function (old) {
          var src = old.src || '';
          if (src.indexOf('lucide') >= 0) { old.remove(); return; }
          var neu = document.createElement('script');
          if (old.src) neu.src = old.src;
          else neu.textContent = (old.textContent || '').replace(
            /if\s*\(window\.lucide\)\s*\{\s*window\.lucide\.createIcons\(\);\s*\}\s*else\s*\{\s*console\.error\([^)]*\);\s*\}/,
            ''
          );
          old.parentNode.replaceChild(neu, old);
        });
        setTimeout(loadScripts, 0);
      })
      .catch(function (err) {
        console.error(err);
        fail(String(err.message || err));
      });
  })();
  </script>
</body>
</html>
