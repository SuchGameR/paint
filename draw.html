<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VersePaint</title>
  <style>
    html, body { margin:0; height:100%; background:#0b0b0b; color:#bbb; font-family: system-ui, sans-serif; }
    #boot { display:grid; place-items:center; height:100%; font-size:14px; }
  </style>
</head>
<body>
  <div id="boot">UI を準備しています…</div>
  <script>
  (function () {
    function fail(m) {
      var b = document.getElementById('boot');
      if (b) b.textContent = m || '読み込みに失敗しました';
    }

    function improveMenus(html) {
      html = html.replace(/class="menu-command" type="button" disabled/g, 'class="menu-command" type="button"');
      html = html.replace(/class="menu-command" type="button" disabled=""/g, 'class="menu-command" type="button"');
      return html;
    }

    function injectEngine(html) {
      var note = '<!-- lite engine mounts here -->';
      if (/<div class="canvas" id="canvas">\s*<\/div>/.test(html)) {
        html = html.replace(/<div class="canvas" id="canvas">\s*<\/div>/,
          '<div class="canvas" id="canvas">' + note + '</div>');
      }
      var tag = '<script src="./js/draw-lite.js"><\/script>';
      if (html.indexOf('</body>') >= 0) {
        html = html.replace('</body>', tag + '\n</body>');
      } else {
        html += tag;
      }
      return html;
    }

    fetch('./new-ui.html', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('new-ui.html HTTP ' + r.status);
        return r.text();
      })
      .then(function (html) {
        html = improveMenus(html);
        html = injectEngine(html);
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function (err) {
        console.error(err);
        fail(String(err.message || err));
      });
  })();
  </script>
</body>
</html>
