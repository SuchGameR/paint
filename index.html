<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Studio - Geist Canvas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        geist: {
                            50: '#fafafa',
                            100: '#f5f5f5',
                            200: '#e5e5e5',
                            300: '#d4d4d4',
                            400: '#a3a3a3',
                            500: '#737373',
                            600: '#525252',
                            700: '#404040',
                            800: '#262626',
                            900: '#171717',
                            950: '#0a0a0a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['Geist Mono', 'SFMono-Regular', 'Roboto Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Inter', sans-serif;
            background-color: #000;
        }

        /* Geist / Vercel Glass Panel Styling */
        .geist-card {
            background: rgba(10, 10, 10, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.6);
        }

        .geist-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #d4d4d4;
            transition: all 0.15s ease-in-out;
        }
        .geist-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }
        .geist-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 600;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* Canvas cursor dynamic styling */
        canvas {
            touch-action: none;
            display: block;
        }

        /* Dynamic Brush Cursor Circle */
        #brush-cursor {
            pointer-events: none;
            position: absolute;
            border: 1.5px solid rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 9999;
            transition: width 0.04s ease-out, height 0.04s ease-out;
        }

        /* Floating Input Editor for Vector Text */
        .text-editor-input {
            background: transparent;
            border: 1px dashed #000;
            outline: none;
            resize: none;
            overflow: hidden;
            font-family: inherit;
            padding: 2px 4px;
            white-space: pre;
            border-radius: 2px;
        }

        /* Mode Toggle Segmented Control */
        .mode-toggle {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 2px;
        }
        .mode-toggle-btn {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.15s ease;
            color: #a3a3a3;
        }
        .mode-toggle-btn.active {
            background: #ffffff;
            color: #000000;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-black text-gray-100 h-screen w-screen relative overflow-hidden select-none">

    <!-- Infinite Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 w-full h-full cursor-crosshair">
        <canvas id="main-canvas" class="w-full h-full"></canvas>
    </div>

    <!-- Hover Brush Ring Cursor -->
    <div id="brush-cursor"></div>

    <!-- Floating Text Editor Wrapper -->
    <div id="text-editor-container" class="absolute pointer-events-none z-30" style="display: none;"></div>

    <!-- TOP HEADER / TOOLBAR (Vercel Geist Aesthetic) -->
    <header class="absolute top-4 left-4 right-4 flex items-center justify-between pointer-events-none z-20">
        <!-- Logo & Mode Switcher -->
        <div class="geist-card px-3.5 py-2 rounded-xl flex items-center gap-3.5 pointer-events-auto">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded-md bg-white text-black flex items-center justify-center font-bold text-xs">
                    ▲
                </div>
                <span class="font-semibold text-sm tracking-tight text-white font-mono">
                    Infinite<span class="text-gray-400 font-normal">Studio</span>
                </span>
            </div>

            <div class="h-4 w-[1px] bg-geist-800"></div>

            <!-- Vector / Paint Mode Switch -->
            <div class="mode-toggle flex items-center">
                <button id="mode-vector-btn" class="mode-toggle-btn active flex items-center gap-1.5">
                    <i class="fa-solid fa-vector-square text-[10px]"></i>Vector
                </button>
                <button id="mode-paint-btn" class="mode-toggle-btn flex items-center gap-1.5">
                    <i class="fa-solid fa-paintbrush text-[10px]"></i>Paint
                </button>
            </div>
        </div>

        <!-- Center Canvas Controls: Grid & Background Settings -->
        <div class="geist-card px-3 py-1.5 rounded-xl flex items-center gap-2 pointer-events-auto">
            <!-- Grid Toggle Button -->
            <button id="btn-grid-toggle" class="geist-btn px-2.5 py-1 rounded-lg text-xs flex items-center gap-1.5" title="グリッド切替 [G]">
                <i id="grid-icon" class="fa-solid fa-border-all text-xs text-geist-300"></i>
                <span id="grid-label" class="font-mono text-[11px]">Grid</span>
            </button>

            <div class="h-4 w-[1px] bg-geist-800 mx-0.5"></div>

            <!-- Canvas Background Selector -->
            <div class="flex items-center gap-1.5">
                <span class="text-[10px] text-geist-400 font-mono uppercase">Bg:</span>
                <button class="bg-picker-btn w-5 h-5 rounded-md border border-gray-300 bg-white" data-color="#ffffff" title="White"></button>
                <button class="bg-picker-btn w-5 h-5 rounded-md border border-gray-400/30 bg-[#F9F9FB]" data-color="#F9F9FB" title="Warm Off-White"></button>
                <button class="bg-picker-btn w-5 h-5 rounded-md border border-gray-400/30 bg-[#F0F2F5]" data-color="#F0F2F5" title="Soft Slate"></button>
                <button class="bg-picker-btn w-5 h-5 rounded-md border border-gray-700 bg-[#0A0A0A]" data-color="#0A0A0A" title="Dark Midnight"></button>
            </div>
        </div>

        <!-- History & Export Actions -->
        <div class="geist-card px-2.5 py-1.5 rounded-xl flex items-center gap-1.5 pointer-events-auto">
            <button id="btn-undo" class="geist-btn p-1.5 rounded-lg text-xs" title="元に戻す (Ctrl+Z)">
                <i class="fa-solid fa-rotate-left w-4 h-4 flex items-center justify-center"></i>
            </button>
            <button id="btn-redo" class="geist-btn p-1.5 rounded-lg text-xs" title="やり直し (Ctrl+Y)">
                <i class="fa-solid fa-rotate-right w-4 h-4 flex items-center justify-center"></i>
            </button>

            <div class="h-4 w-[1px] bg-geist-800 mx-1"></div>

            <button id="btn-clear" class="geist-btn px-2.5 py-1 rounded-lg text-xs text-rose-400 hover:text-rose-300" title="全消去">
                <i class="fa-solid fa-trash-can mr-1"></i>消去
            </button>

            <div class="relative inline-block text-left">
                <button id="btn-export-menu" class="geist-btn px-2.5 py-1 rounded-lg text-xs font-medium bg-white text-black hover:bg-gray-200 border-white flex items-center gap-1">
                    <i class="fa-solid fa-download text-[11px]"></i>書き出し
                </button>
                <!-- Export Menu Popup -->
                <div id="export-popup" class="hidden absolute right-0 mt-2 w-44 geist-card rounded-xl shadow-2xl py-1.5 z-50 text-xs border border-geist-800">
                    <button id="export-png" class="w-full text-left px-3.5 py-1.5 hover:bg-white/10 flex items-center gap-2 text-geist-200">
                        <i class="fa-regular fa-image text-white"></i>PNG 画像 (.png)
                    </button>
                    <button id="export-jpeg" class="w-full text-left px-3.5 py-1.5 hover:bg-white/10 flex items-center gap-2 text-geist-200">
                        <i class="fa-regular fa-file-image text-white"></i>JPEG 画像 (.jpg)
                    </button>
                    <button id="export-svg" class="w-full text-left px-3.5 py-1.5 hover:bg-white/10 flex items-center gap-2 text-geist-200">
                        <i class="fa-solid fa-bezier-curve text-white"></i>Vector SVG (.svg)
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- LEFT SIDEBAR: MAIN TOOLBAR -->
    <aside class="absolute left-4 top-1/2 -translate-y-1/2 geist-card p-1.5 rounded-xl flex flex-col gap-1.5 z-20 pointer-events-auto">
        <!-- Hand / Pan Tool -->
        <button id="tool-hand" class="geist-btn p-2.5 rounded-lg" title="キャンバス移動 [Space / H]">
            <i class="fa-solid fa-hand text-base"></i>
        </button>

        <!-- Select Tool (Vector Mode Only) -->
        <button id="tool-select" class="geist-btn p-2.5 rounded-lg" title="選択 [V]">
            <i class="fa-solid fa-arrow-pointer text-base"></i>
        </button>

        <div class="h-[1px] w-full bg-geist-800 my-0.5"></div>

        <!-- Brush Tool -->
        <button id="tool-brush" class="geist-btn active p-2.5 rounded-lg" title="ブラシ [B]">
            <i class="fa-solid fa-pen-nib text-base"></i>
        </button>

        <!-- Text Tool -->
        <button id="tool-text" class="geist-btn p-2.5 rounded-lg" title="テキスト [T]">
            <i class="fa-solid fa-font text-base"></i>
        </button>

        <!-- Shape Tools Dropdown -->
        <div class="relative group">
            <button id="tool-shapes" class="geist-btn p-2.5 rounded-lg w-full flex items-center justify-center" title="図形">
                <i id="shape-icon-active" class="fa-regular fa-square text-base"></i>
            </button>
            <div class="absolute left-12 top-0 geist-card p-1 rounded-lg hidden group-hover:flex flex-col gap-1 shadow-2xl border border-geist-800">
                <button id="shape-rect" class="geist-btn p-2 rounded-md hover:text-white" title="四角形">
                    <i class="fa-regular fa-square"></i>
                </button>
                <button id="shape-circle" class="geist-btn p-2 rounded-md hover:text-white" title="円">
                    <i class="fa-regular fa-circle"></i>
                </button>
                <button id="shape-line" class="geist-btn p-2 rounded-md hover:text-white" title="直線">
                    <i class="fa-solid fa-minus"></i>
                </button>
                <button id="shape-arrow" class="geist-btn p-2 rounded-md hover:text-white" title="矢印">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- Eraser Tool -->
        <button id="tool-eraser" class="geist-btn p-2.5 rounded-lg" title="消しゴム [E]">
            <i class="fa-solid fa-eraser text-base"></i>
        </button>

        <!-- Eyedropper Tool -->
        <button id="tool-eyedropper" class="geist-btn p-2.5 rounded-lg" title="スポイト [I]">
            <i class="fa-solid fa-eye-dropper text-base"></i>
        </button>
    </aside>

    <!-- RIGHT SIDEBAR: PROPERTIES & CURATED PALETTES -->
    <aside class="absolute right-4 top-20 bottom-12 w-72 geist-card p-3.5 rounded-xl flex flex-col gap-3.5 z-20 pointer-events-auto overflow-y-auto">
        <div class="flex justify-between items-center pb-2 border-b border-geist-800">
            <h2 class="text-[11px] font-mono uppercase tracking-wider text-geist-400">プロパティ</h2>
            <span id="active-tool-badge" class="text-[10px] px-2 py-0.5 rounded bg-geist-800 text-geist-200 font-mono">BRUSH</span>
        </div>

        <!-- Paint Mode Brush Presets -->
        <div id="paint-presets-panel" class="hidden flex-col gap-1.5">
            <label class="text-[11px] text-geist-300 font-medium">ペイントタイプ</label>
            <div class="grid grid-cols-3 gap-1">
                <button class="paint-preset-btn active geist-btn p-1.5 rounded-lg text-xs flex flex-col items-center gap-1" data-preset="pen">
                    <i class="fa-solid fa-pen text-xs"></i><span>ペン</span>
                </button>
                <button class="paint-preset-btn geist-btn p-1.5 rounded-lg text-xs flex flex-col items-center gap-1" data-preset="marker">
                    <i class="fa-solid fa-highlighter text-xs"></i><span>マーカー</span>
                </button>
                <button class="paint-preset-btn geist-btn p-1.5 rounded-lg text-xs flex flex-col items-center gap-1" data-preset="airbrush">
                    <i class="fa-solid fa-spray-can text-xs"></i><span>エアブラシ</span>
                </button>
            </div>
        </div>

        <!-- Stroke Width Slider -->
        <div class="flex flex-col gap-1">
            <div class="flex justify-between items-center">
                <label class="text-[11px] text-geist-300 font-medium">サイズ (Ctrl+Scroll)</label>
                <span id="stroke-width-val" class="text-xs font-mono text-white">12px</span>
            </div>
            <input id="stroke-width-slider" type="range" min="1" max="150" value="12" class="w-full accent-white cursor-pointer h-1 bg-geist-800 rounded-lg">
        </div>

        <!-- Opacity Slider -->
        <div class="flex flex-col gap-1">
            <div class="flex justify-between items-center">
                <label class="text-[11px] text-geist-300 font-medium">不透明度</label>
                <span id="opacity-val" class="text-xs font-mono text-white">100%</span>
            </div>
            <input id="opacity-slider" type="range" min="1" max="100" value="100" class="w-full accent-white cursor-pointer h-1 bg-geist-800 rounded-lg">
        </div>

        <!-- Color Section -->
        <div class="flex flex-col gap-2.5 pt-2 border-t border-geist-800">
            <label class="text-[11px] text-geist-300 font-medium">カラー</label>
            <div class="flex items-center gap-2.5">
                <div class="relative group cursor-pointer flex-shrink-0">
                    <input id="color-picker-input" type="color" value="#000000" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10">
                    <div id="color-preview-box" class="w-9 h-9 rounded-lg border border-white/20 shadow-inner flex items-center justify-center" style="background-color: #000000;"></div>
                </div>
                <div class="flex-1 flex items-center gap-1.5 bg-geist-900 px-2.5 py-1 rounded-lg border border-geist-800">
                    <span class="text-geist-500 text-xs font-mono">HEX</span>
                    <input id="color-hex-input" type="text" value="#000000" class="bg-transparent text-xs text-white font-mono outline-none w-full uppercase">
                </div>
            </div>

            <!-- Curated Palette Selector -->
            <div class="flex flex-col gap-1.5 pt-1">
                <div class="flex justify-between items-center">
                    <span class="text-[10px] text-geist-400 font-mono">パレットテーマ</span>
                    <select id="palette-theme-select" class="bg-geist-900 border border-geist-800 text-[10px] text-geist-300 rounded px-1.5 py-0.5 outline-none">
                        <option value="monochrome">Monochrome</option>
                        <option value="neon">Vercel Neon</option>
                        <option value="pastel">Pastel</option>
                        <option value="earthy">Earthy</option>
                    </select>
                </div>
                <div id="palette-presets" class="grid grid-cols-6 gap-1.5">
                    <!-- Dynamic Swatches -->
                </div>
            </div>
        </div>
    </aside>

    <!-- BOTTOM HUD (COORDINATES, ZOOM, SHORTCUT HELP) -->
    <footer class="absolute bottom-4 left-4 right-4 flex items-center justify-between pointer-events-none z-20">
        <!-- Canvas Coordinates & Scale Info -->
        <div class="geist-card px-3 py-1 rounded-lg text-xs font-mono text-geist-400 flex items-center gap-3 pointer-events-auto">
            <span id="hud-coords">X: 0, Y: 0</span>
            <div class="h-3 w-[1px] bg-geist-800"></div>
            <span id="hud-zoom" class="text-white font-semibold">100%</span>
        </div>

        <!-- Zoom Control Buttons -->
        <div class="geist-card px-1.5 py-0.5 rounded-lg flex items-center gap-1 pointer-events-auto">
            <button id="btn-zoom-out" class="geist-btn p-1 rounded-md text-geist-300 hover:text-white" title="縮小">
                <i class="fa-solid fa-minus text-[10px]"></i>
            </button>
            <button id="btn-zoom-reset" class="geist-btn px-1.5 py-0.5 rounded-md text-[10px] font-mono text-geist-300 hover:text-white" title="リセット">
                100%
            </button>
            <button id="btn-zoom-in" class="geist-btn p-1 rounded-md text-geist-300 hover:text-white" title="拡大">
                <i class="fa-solid fa-plus text-[10px]"></i>
            </button>
        </div>

        <!-- Shortcut Modal Trigger -->
        <button id="btn-shortcuts-modal" class="geist-card px-2.5 py-1 rounded-lg text-[11px] font-mono text-geist-300 hover:text-white pointer-events-auto flex items-center gap-1.5">
            <i class="fa-solid fa-keyboard"></i>[?] ショートカット
        </button>
    </footer>

    <!-- SHORTCUTS MODAL DIALOG -->
    <div id="shortcuts-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="geist-card max-w-md w-full rounded-2xl p-5 border border-geist-800 shadow-2xl">
            <div class="flex justify-between items-center pb-3 border-b border-geist-800">
                <h3 class="text-sm font-semibold text-white flex items-center gap-2">
                    <i class="fa-solid fa-keyboard text-geist-400"></i>キーボードショートカット
                </h3>
                <button id="btn-close-modal" class="text-geist-400 hover:text-white text-base">&times;</button>
            </div>
            <div class="grid grid-cols-2 gap-2.5 my-4 text-xs font-mono">
                <div class="flex justify-between bg-geist-900 p-2 rounded-lg border border-geist-800">
                    <span class="text-geist-400">キャンバス移動</span><span class="text-white">Space + Drag</span>
                </div>
                <div class="flex justify-between bg-geist-900 p-2 rounded-lg border border-geist-800">
                    <span class="text-geist-400">ブラシサイズ</span><span class="text-white">Ctrl + Wheel</span>
                </div>
                <div class="flex justify-between bg-geist-900 p-2 rounded-lg border border-geist-800">
                    <span class="text-geist-400">ブラシツール</span><span class="text-white">B</span>
                </div>
                <div class="flex justify-between bg-geist-900 p-2 rounded-lg border border-geist-800">
                    <span class="text-geist-400">消しゴム</span><span class="text-white">E</span>
                </div>
                <div class="flex justify-between bg-geist-900 p-2 rounded-lg border border-geist-800">
                    <span class="text-geist-400">テキスト</span><span class="text-white">T</span>
                </div>
                <div class="flex justify-between bg-geist-900 p-2 rounded-lg border border-geist-800">
                    <span class="text-geist-400">グリッド切替</span><span class="text-white">G</span>
                </div>
                <div class="flex justify-between bg-geist-900 p-2 rounded-lg border border-geist-800">
                    <span class="text-geist-400">Undo / Redo</span><span class="text-white">Ctrl+Z / Y</span>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT APPLICATION CODE -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- APP STATE ---
            const state = {
                mode: 'vector', // 'vector' | 'paint'
                tool: 'brush', // 'hand', 'select', 'brush', 'text', 'rect', 'circle', 'line', 'arrow', 'eraser', 'eyedropper'
                paintPreset: 'pen',
                
                // Infinite Canvas Transform
                zoom: 1.0,
                panX: 0,
                panY: 0,

                // Grid & Canvas Background
                gridMode: 'grid', // 'grid' | 'dots' | 'off'
                canvasBg: '#ffffff',

                // Drawing Properties
                color: '#000000',
                strokeWidth: 12,
                opacity: 1.0,

                // Interactions
                isPanning: false,
                isDrawing: false,
                spacePressed: false,
                ctrlPressed: false,
                lastMousePos: { x: 0, y: 0 },
                startMousePos: { x: 0, y: 0 },

                // Vector Elements Store
                vectorObjects: [],
                
                // Raster Paint Layers Stack
                layers: [
                    { id: 1, name: 'Layer 1', visible: true, canvas: null, ctx: null }
                ],
                activeLayerIndex: 0,

                // History Stacks
                undoStack: [],
                redoStack: [],

                // Curated Palettes
                palettes: {
                    monochrome: ['#000000', '#262626', '#525252', '#a3a3a3', '#d4d4d4', '#ffffff'],
                    neon: ['#000000', '#0070f3', '#7928ca', '#f5a623', '#ff0080', '#50e3c2'],
                    pastel: ['#2b2d42', '#ffb5a7', '#fcd5ce', '#f8edeb', '#f8ad9d', '#f4a261'],
                    earthy: ['#1b4332', '#2d6a4f', '#40916c', '#52b788', '#74c69d', '#b7e4c7']
                }
            };

            // DOM References
            const container = document.getElementById('canvas-container');
            const mainCanvas = document.getElementById('main-canvas');
            const ctx = mainCanvas.getContext('2d');
            const brushCursor = document.getElementById('brush-cursor');

            const hudCoords = document.getElementById('hud-coords');
            const hudZoom = document.getElementById('hud-zoom');
            const strokeWidthSlider = document.getElementById('stroke-width-slider');
            const strokeWidthVal = document.getElementById('stroke-width-val');
            const opacitySlider = document.getElementById('opacity-slider');
            const opacityVal = document.getElementById('opacity-val');
            const colorPickerInput = document.getElementById('color-picker-input');
            const colorPreviewBox = document.getElementById('color-preview-box');
            const colorHexInput = document.getElementById('color-hex-input');

            // --- CANVAS RESIZE & LAYER INITIALIZATION ---
            function resizeCanvas() {
                mainCanvas.width = window.innerWidth;
                mainCanvas.height = window.innerHeight;

                state.layers.forEach(layer => {
                    if (!layer.canvas) {
                        layer.canvas = document.createElement('canvas');
                        layer.canvas.width = mainCanvas.width;
                        layer.canvas.height = mainCanvas.height;
                        layer.ctx = layer.canvas.getContext('2d');
                    }
                });
                renderCanvas();
            }
            window.addEventListener('resize', resizeCanvas);

            // --- PALETTE MANAGEMENT ---
            const palettePresetsContainer = document.getElementById('palette-presets');
            const paletteThemeSelect = document.getElementById('palette-theme-select');

            function renderSwatches(theme) {
                palettePresetsContainer.innerHTML = '';
                const colors = state.palettes[theme] || state.palettes.monochrome;
                colors.forEach(hex => {
                    const btn = document.createElement('button');
                    btn.className = 'w-6 h-6 rounded-md border border-white/20 transition-transform hover:scale-110';
                    btn.style.backgroundColor = hex;
                    btn.addEventListener('click', () => updateColor(hex));
                    palettePresetsContainer.appendChild(btn);
                });
            }

            paletteThemeSelect.addEventListener('change', (e) => renderSwatches(e.target.value));

            function updateColor(hex) {
                state.color = hex;
                colorPickerInput.value = hex;
                colorPreviewBox.style.backgroundColor = hex;
                colorHexInput.value = hex.toUpperCase();
            }

            colorPickerInput.addEventListener('input', (e) => updateColor(e.target.value));
            colorHexInput.addEventListener('change', (e) => {
                let hex = e.target.value;
                if (!hex.startsWith('#')) hex = '#' + hex;
                if (/^#[0-9A-F]{6}$/i.test(hex)) updateColor(hex);
            });

            // --- CANVAS BACKGROUND SWITCHER ---
            document.querySelectorAll('.bg-picker-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.canvasBg = btn.dataset.color;
                    renderCanvas();
                });
            });

            // --- GRID TOGGLE CONTROL ---
            const btnGridToggle = document.getElementById('btn-grid-toggle');
            const gridLabel = document.getElementById('grid-label');

            function cycleGridMode() {
                if (state.gridMode === 'grid') state.gridMode = 'dots';
                else if (state.gridMode === 'dots') state.gridMode = 'off';
                else state.gridMode = 'grid';

                gridLabel.innerText = state.gridMode.toUpperCase();
                renderCanvas();
            }
            btnGridToggle.addEventListener('click', cycleGridMode);

            // --- ENGINE & TOOL SWITCHING ---
            const modeVectorBtn = document.getElementById('mode-vector-btn');
            const modePaintBtn = document.getElementById('mode-paint-btn');
            const paintPresetsPanel = document.getElementById('paint-presets-panel');

            function setEngineMode(mode) {
                state.mode = mode;
                if (mode === 'paint') {
                    modeVectorBtn.classList.remove('active');
                    modePaintBtn.classList.add('active');
                    paintPresetsPanel.classList.remove('hidden');
                    paintPresetsPanel.classList.add('flex');
                } else {
                    modePaintBtn.classList.remove('active');
                    modeVectorBtn.classList.add('active');
                    paintPresetsPanel.classList.add('hidden');
                    paintPresetsPanel.classList.remove('flex');
                }
                renderCanvas();
            }

            modeVectorBtn.addEventListener('click', () => setEngineMode('vector'));
            modePaintBtn.addEventListener('click', () => setEngineMode('paint'));

            const tools = {
                hand: document.getElementById('tool-hand'),
                select: document.getElementById('tool-select'),
                brush: document.getElementById('tool-brush'),
                text: document.getElementById('tool-text'),
                shapes: document.getElementById('tool-shapes'),
                eraser: document.getElementById('tool-eraser'),
                eyedropper: document.getElementById('tool-eyedropper')
            };

            function setTool(toolName) {
                state.tool = toolName;
                Object.keys(tools).forEach(k => tools[k] && tools[k].classList.remove('active'));
                if (tools[toolName]) tools[toolName].classList.add('active');
                document.getElementById('active-tool-badge').innerText = toolName.toUpperCase();
                container.style.cursor = toolName === 'hand' ? 'grab' : 'crosshair';
            }

            Object.keys(tools).forEach(k => {
                if (tools[k]) tools[k].addEventListener('click', () => setTool(k));
            });

            ['rect', 'circle', 'line', 'arrow'].forEach(s => {
                document.getElementById(`shape-${s}`).addEventListener('click', (e) => {
                    e.stopPropagation();
                    setTool(s);
                });
            });

            // Sliders
            strokeWidthSlider.addEventListener('input', (e) => {
                state.strokeWidth = parseInt(e.target.value);
                strokeWidthVal.innerText = `${state.strokeWidth}px`;
                updateCursorPreview();
            });

            opacitySlider.addEventListener('input', (e) => {
                state.opacity = parseInt(e.target.value) / 100;
                opacityVal.innerText = `${e.target.value}%`;
            });

            // --- TRANSFORM CALCULATIONS ---
            function screenToWorld(sx, sy) {
                return { x: (sx - state.panX) / state.zoom, y: (sy - state.panY) / state.zoom };
            }
            function worldToScreen(wx, wy) {
                return { x: wx * state.zoom + state.panX, y: wy * state.zoom + state.panY };
            }

            // --- GRID RENDER ENGINE ---
            function drawBackgroundGrid() {
                const w = mainCanvas.width;
                const h = mainCanvas.height;

                ctx.save();
                ctx.fillStyle = state.canvasBg;
                ctx.fillRect(0, 0, w, h);

                if (state.gridMode === 'off') {
                    ctx.restore();
                    return;
                }

                const step = 40 * state.zoom;
                const offsetX = state.panX % step;
                const offsetY = state.panY % step;
                const isDarkBg = state.canvasBg === '#0A0A0A';

                ctx.strokeStyle = isDarkBg ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
                ctx.fillStyle = isDarkBg ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.15)';
                ctx.lineWidth = 1;

                if (state.gridMode === 'grid') {
                    ctx.beginPath();
                    for (let x = offsetX; x < w; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
                    for (let y = offsetY; y < h; y += step) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
                    ctx.stroke();
                } else if (state.gridMode === 'dots') {
                    for (let x = offsetX; x < w; x += step) {
                        for (let y = offsetY; y < h; y += step) {
                            ctx.beginPath();
                            ctx.arc(x, y, 1.2 * Math.min(state.zoom, 1.5), 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }
                ctx.restore();
            }

            // --- RENDER LOOP ---
            function renderCanvas() {
                drawBackgroundGrid();

                ctx.save();
                ctx.translate(state.panX, state.panY);
                ctx.scale(state.zoom, state.zoom);

                // 1. Draw Paint Layers
                state.layers.forEach(l => {
                    if (l.visible && l.canvas) {
                        ctx.save();
                        ctx.globalAlpha = state.opacity;
                        ctx.drawImage(l.canvas, 0, 0);
                        ctx.restore();
                    }
                });

                // 2. Draw Vector Objects
                state.vectorObjects.forEach(obj => drawVectorObject(obj));

                ctx.restore();
            }

            function drawVectorObject(obj) {
                ctx.save();
                ctx.strokeStyle = obj.color;
                ctx.fillStyle = obj.color;
                ctx.lineWidth = obj.strokeWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.globalAlpha = obj.opacity || 1.0;

                if (obj.type === 'path' && obj.points.length > 0) {
                    ctx.beginPath();
                    ctx.moveTo(obj.points[0].x, obj.points[0].y);
                    for (let i = 1; i < obj.points.length; i++) ctx.lineTo(obj.points[i].x, obj.points[i].y);
                    ctx.stroke();
                } else if (obj.type === 'rect') {
                    ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
                } else if (obj.type === 'circle') {
                    ctx.beginPath();
                    const r = Math.sqrt(obj.w * obj.w + obj.h * obj.h);
                    ctx.arc(obj.x, obj.y, r, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (obj.type === 'text') {
                    ctx.font = `${obj.fontSize || 24}px Inter, sans-serif`;
                    ctx.fillText(obj.text, obj.x, obj.y);
                }
                ctx.restore();
            }

            // --- INTERACTIVITY HANDLERS ---
            let currentPath = null;
            let currentShape = null;

            container.addEventListener('mousedown', (e) => {
                const rect = mainCanvas.getBoundingClientRect();
                const sx = e.clientX - rect.left;
                const sy = e.clientY - rect.top;
                const world = screenToWorld(sx, sy);

                state.lastMousePos = { x: sx, y: sy };
                state.startMousePos = world;

                if (state.tool === 'hand' || state.spacePressed || e.button === 1) {
                    state.isPanning = true;
                    container.style.cursor = 'grabbing';
                    return;
                }

                if (state.tool === 'text') {
                    spawnTextEditor(world.x, world.y);
                    return;
                }

                state.isDrawing = true;

                if (state.mode === 'vector') {
                    if (state.tool === 'brush') {
                        currentPath = {
                            id: Date.now(),
                            type: 'path',
                            color: state.color,
                            strokeWidth: state.strokeWidth,
                            opacity: state.opacity,
                            points: [world]
                        };
                        state.vectorObjects.push(currentPath);
                    } else if (['rect', 'circle'].includes(state.tool)) {
                        currentShape = {
                            id: Date.now(),
                            type: state.tool,
                            x: world.x, y: world.y, w: 0, h: 0,
                            color: state.color, strokeWidth: state.strokeWidth, opacity: state.opacity
                        };
                        state.vectorObjects.push(currentShape);
                    }
                } else {
                    const lCtx = state.layers[state.activeLayerIndex].ctx;
                    if (!lCtx) return;
                    lCtx.save();
                    lCtx.strokeStyle = state.color;
                    lCtx.lineWidth = state.strokeWidth;
                    lCtx.lineCap = 'round';
                    lCtx.globalCompositeOperation = state.tool === 'eraser' ? 'destination-out' : 'source-over';
                    lCtx.beginPath();
                    lCtx.moveTo(world.x, world.y);
                }
            });

            container.addEventListener('mousemove', (e) => {
                const rect = mainCanvas.getBoundingClientRect();
                const sx = e.clientX - rect.left;
                const sy = e.clientY - rect.top;
                const world = screenToWorld(sx, sy);

                hudCoords.innerText = `X: ${Math.round(world.x)}, Y: ${Math.round(world.y)}`;
                updateCursorPreview(sx, sy);

                if (state.isPanning) {
                    state.panX += sx - state.lastMousePos.x;
                    state.panY += sy - state.lastMousePos.y;
                    state.lastMousePos = { x: sx, y: sy };
                    renderCanvas();
                    return;
                }

                if (!state.isDrawing) return;

                if (state.mode === 'vector') {
                    if (state.tool === 'brush' && currentPath) {
                        currentPath.points.push(world);
                        renderCanvas();
                    } else if (currentShape) {
                        currentShape.w = world.x - state.startMousePos.x;
                        currentShape.h = world.y - state.startMousePos.y;
                        renderCanvas();
                    }
                } else {
                    const lCtx = state.layers[state.activeLayerIndex].ctx;
                    if (lCtx) {
                        lCtx.lineTo(world.x, world.y);
                        lCtx.stroke();
                        renderCanvas();
                    }
                }
            });

            window.addEventListener('mouseup', () => {
                if (state.isPanning) {
                    state.isPanning = false;
                    container.style.cursor = state.tool === 'hand' ? 'grab' : 'crosshair';
                }
                if (state.isDrawing) {
                    state.isDrawing = false;
                    saveHistory();
                }
                currentPath = null;
                currentShape = null;
            });

            // --- CTRL + SCROLL WHEEL DYNAMIC BRUSH RESIZING ---
            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (e.ctrlKey || state.ctrlPressed) {
                    const delta = e.deltaY < 0 ? 2 : -2;
                    state.strokeWidth = Math.max(1, Math.min(150, state.strokeWidth + delta));
                    strokeWidthSlider.value = state.strokeWidth;
                    strokeWidthVal.innerText = `${state.strokeWidth}px`;
                    updateCursorPreview();
                    return;
                }

                // Smooth Infinite Zooming
                const zoomFactor = 1.08;
                const mouseX = e.clientX;
                const mouseY = e.clientY;
                const worldBefore = screenToWorld(mouseX, mouseY);

                if (e.deltaY < 0) state.zoom = Math.min(20, state.zoom * zoomFactor);
                else state.zoom = Math.max(0.1, state.zoom / zoomFactor);

                const worldAfter = screenToWorld(mouseX, mouseY);
                state.panX += (worldAfter.x - worldBefore.x) * state.zoom;
                state.panY += (worldAfter.y - worldBefore.y) * state.zoom;

                hudZoom.innerText = `${Math.round(state.zoom * 100)}%`;
                renderCanvas();
            }, { passive: false });

            // Cursor Hover Ring
            function updateCursorPreview(x, y) {
                if (x === undefined) { x = state.lastMousePos.x; y = state.lastMousePos.y; }
                if (['brush', 'eraser'].includes(state.tool)) {
                    brushCursor.style.display = 'block';
                    const r = state.strokeWidth * state.zoom;
                    brushCursor.style.width = `${r}px`;
                    brushCursor.style.height = `${r}px`;
                    brushCursor.style.left = `${x}px`;
                    brushCursor.style.top = `${y}px`;
                } else {
                    brushCursor.style.display = 'none';
                }
            }

            // --- TEXT TOOL ENGINE ---
            const textEditorContainer = document.getElementById('text-editor-container');
            function spawnTextEditor(wx, wy) {
                const sp = worldToScreen(wx, wy);
                textEditorContainer.style.display = 'block';
                textEditorContainer.style.left = `${sp.x}px`;
                textEditorContainer.style.top = `${sp.y}px`;

                const textarea = document.createElement('textarea');
                textarea.className = 'text-editor-input';
                textarea.style.color = state.color;
                textarea.style.fontSize = `${24 * state.zoom}px`;
                textarea.placeholder = 'テキストを入力...';

                textEditorContainer.innerHTML = '';
                textEditorContainer.appendChild(textarea);
                textarea.focus();

                textarea.addEventListener('blur', () => {
                    const val = textarea.value.trim();
                    if (val !== '') {
                        state.vectorObjects.push({
                            id: Date.now(),
                            type: 'text',
                            text: val,
                            x: wx, y: wy,
                            color: state.color,
                            fontSize: 24
                        });
                        renderCanvas();
                        saveHistory();
                    }
                    textEditorContainer.style.display = 'none';
                });
            }

            // --- UNDO / REDO ENGINE ---
            function saveHistory() {
                state.undoStack.push(JSON.stringify(state.vectorObjects));
                state.redoStack = [];
            }
            function undo() {
                if (state.undoStack.length > 0) {
                    state.redoStack.push(JSON.stringify(state.vectorObjects));
                    state.vectorObjects = JSON.parse(state.undoStack.pop());
                    renderCanvas();
                }
            }
            function redo() {
                if (state.redoStack.length > 0) {
                    state.undoStack.push(JSON.stringify(state.vectorObjects));
                    state.vectorObjects = JSON.parse(state.redoStack.pop());
                    renderCanvas();
                }
            }

            document.getElementById('btn-undo').addEventListener('click', undo);
            document.getElementById('btn-redo').addEventListener('click', redo);

            document.getElementById('btn-clear').addEventListener('click', () => {
                if (confirm('すべての内容を消去しますか？')) {
                    state.vectorObjects = [];
                    state.layers.forEach(l => l.ctx && l.ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height));
                    renderCanvas();
                    saveHistory();
                }
            });

            // --- KEYBOARD SHORTCUTS ---
            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.code === 'Space') { state.spacePressed = true; container.style.cursor = 'grab'; }
                if (e.key === 'Control') state.ctrlPressed = true;
                if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
                if (e.ctrlKey && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) { e.preventDefault(); redo(); }
                if (e.key === 'g' || e.key === 'G') cycleGridMode();
                if (e.key === 'b' || e.key === 'B') setTool('brush');
                if (e.key === 'e' || e.key === 'E') setTool('eraser');
                if (e.key === 't' || e.key === 'T') setTool('text');
                if (e.key === '?') document.getElementById('shortcuts-modal').classList.remove('hidden');
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'Space') { state.spacePressed = false; container.style.cursor = 'crosshair'; }
                if (e.key === 'Control') state.ctrlPressed = false;
            });

            // Shortcuts Modal
            document.getElementById('btn-shortcuts-modal').addEventListener('click', () => {
                document.getElementById('shortcuts-modal').classList.remove('hidden');
            });
            document.getElementById('btn-close-modal').addEventListener('click', () => {
                document.getElementById('shortcuts-modal').classList.add('hidden');
            });

            // Export Popup Toggle
            const exportMenuBtn = document.getElementById('btn-export-menu');
            const exportPopup = document.getElementById('export-popup');
            exportMenuBtn.addEventListener('click', (e) => { e.stopPropagation(); exportPopup.classList.toggle('hidden'); });
            document.addEventListener('click', () => exportPopup.classList.add('hidden'));

            document.getElementById('export-png').addEventListener('click', () => {
                const link = document.createElement('a');
                link.download = 'canvas.png';
                link.href = mainCanvas.toDataURL('image/png');
                link.click();
            });

            // Init App
            renderSwatches('monochrome');
            resizeCanvas();
        });
    </script>
</body>
</html>
