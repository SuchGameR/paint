<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        geist: {
                            50: '#fafafa', 100: '#f5f5f5', 200: '#e5e5e5', 300: '#d4d4d4',
                            400: '#a3a3a3', 500: '#737373', 600: '#525252', 700: '#404040',
                            800: '#262626', 900: '#171717', 950: '#0a0a0a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Geist', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['Geist Mono', 'ui-monospace', 'SFMono-Regular', 'Roboto Mono', 'monospace']
                    },
                    boxShadow: {
                        'border': '0 0 0 1px rgba(255,255,255,0.08)',
                        'border-strong': '0 0 0 1px rgba(255,255,255,0.14)',
                        'elevated': '0 0 0 1px rgba(255,255,255,0.08), 0 8px 24px rgba(0,0,0,0.4)',
                        'menu': '0 0 0 1px rgba(255,255,255,0.1), 0 16px 48px rgba(0,0,0,0.55)'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Inter', system-ui, sans-serif;
            background: #000;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
        .geist-surface {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.09);
        }
        .geist-btn {
            background: transparent;
            border: none;
            color: #a3a3a3;
            transition: color 0.12s ease, background 0.12s ease;
            border-radius: 6px;
            min-width: 32px;
            min-height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .geist-btn:hover {
            background: rgba(255,255,255,0.08);
            color: #fafafa;
        }
        .geist-btn:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 1px;
        }
        .geist-btn.active {
            background: #fafafa;
            color: #0a0a0a;
            font-weight: 500;
        }
        .geist-btn.active:hover {
            background: #e5e5e5;
            color: #0a0a0a;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        #brush-cursor {
            pointer-events: none;
            position: absolute;
            border: 1.5px solid rgba(0,0,0,0.75);
            box-shadow: 0 0 0 1.5px rgba(255,255,255,0.95);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 9999;
            transition: width 0.03s linear, height 0.03s linear;
            will-change: width, height, left, top;
        }
        #text-editor-container {
            z-index: 100;
        }
        .text-editor-input {
            background: rgba(255,255,255,0.96);
            border: 1.5px solid #171717;
            outline: none;
            resize: both;
            overflow: auto;
            font-family: inherit;
            padding: 6px 8px;
            white-space: pre-wrap;
            border-radius: 4px;
            min-width: 140px;
            min-height: 32px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            font-size: 16px;
            pointer-events: auto;
        }
        .mode-toggle {
            background: rgba(255,255,255,0.06);
            border-radius: 7px;
            padding: 2px;
        }
        .mode-toggle-btn {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.12s ease;
            color: #737373;
            min-height: 28px;
        }
        .mode-toggle-btn.active {
            background: #fafafa;
            color: #0a0a0a;
            font-weight: 600;
        }
        .swatch {
            width: 24px;
            height: 24px;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.12);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            cursor: pointer;
        }
        .swatch:hover, .swatch:active {
            transform: scale(1.1);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.3);
        }
        .swatch.active {
            box-shadow: 0 0 0 2px #fff;
        }
        .slider {
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: #262626;
            border-radius: 2px;
            outline: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fafafa;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.3);
        }
        .slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fafafa;
            cursor: pointer;
            border: none;
        }
        .props-scroll::-webkit-scrollbar { width: 4px; }
        .props-scroll::-webkit-scrollbar-track { background: transparent; }
        .props-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        .selection-box {
            position: absolute;
            border: 1px solid #0070f3;
            background: rgba(0,112,243,0.08);
            pointer-events: none;
            z-index: 5;
            display: none;
        }

        /* ===== Mobile / compact layout ===== */
        @media (max-width: 768px) {
            .geist-btn {
                min-width: 42px;
                min-height: 42px;
            }
            .swatch {
                width: 28px;
                height: 28px;
            }
            .slider::-webkit-slider-thumb {
                width: 20px;
                height: 20px;
            }
            .slider::-moz-range-thumb {
                width: 20px;
                height: 20px;
            }
            /* Hide less critical labels on very small screens */
            .hide-sm { display: none !important; }
            /* Properties panel bottom sheet on mobile */
            #props-panel.open {
                top: auto !important;
                bottom: 56px !important;
                right: 6px !important;
                left: 54px !important;
                width: auto !important;
                max-height: 40vh !important;
                transform: none !important;
            }
            /* Left toolbar lower on mobile */
            #left-toolbar {
                left: 6px !important;
                top: auto !important;
                bottom: 56px !important;
                transform: none !important;
            }
            /* Top bar tighter */
            #top-bar {
                top: 6px !important;
                left: 6px !important;
                right: 6px !important;
                gap: 6px !important;
            }
            #top-bar > div {
                padding-left: 8px !important;
                padding-right: 8px !important;
            }
            /* Bottom HUD */
            #bottom-hud {
                bottom: 6px !important;
                left: 6px !important;
                right: 6px !important;
            }
            /* Compact mode toggle text */
            .mode-toggle-btn span { display: none; }
            .mode-toggle-btn { padding: 6px 8px; }
        }

        @media (max-width: 480px) {
            #center-controls { display: none !important; }
            #export-label { display: none; }
        }
    </style>
</head>
<body class="bg-black text-gray-100 h-screen w-screen relative overflow-hidden">

    <!-- Canvas -->
    <div id="canvas-container" class="absolute inset-0 w-full h-full cursor-crosshair">
        <canvas id="main-canvas"></canvas>
        <div id="selection-box" class="selection-box"></div>
    </div>
    <div id="brush-cursor"></div>
    <div id="text-editor-container" class="absolute pointer-events-none z-30" style="display:none;"></div>

    <!-- TOP BAR -->
    <header id="top-bar" class="absolute top-2 left-2 right-2 flex items-center justify-between pointer-events-none z-40">
        <div class="geist-surface px-2 py-1 rounded-lg flex items-center gap-1.5 pointer-events-auto">
            <div class="w-5 h-5 rounded bg-white text-black flex items-center justify-center text-[10px] font-semibold">▲</div>
            <div class="mode-toggle flex">
                <button id="mode-vector-btn" class="mode-toggle-btn active flex items-center gap-1">
                    <i class="fa-solid fa-vector-square text-[9px]"></i><span class="hide-sm">Vector</span>
                </button>
                <button id="mode-paint-btn" class="mode-toggle-btn flex items-center gap-1">
                    <i class="fa-solid fa-paintbrush text-[9px]"></i><span class="hide-sm">Paint</span>
                </button>
            </div>
        </div>

        <div class="geist-surface px-1 py-1 rounded-lg flex items-center gap-0.5 pointer-events-auto">
            <button id="btn-undo" class="geist-btn rounded-md" title="元に戻す (⌘Z)" disabled>
                <i class="fa-solid fa-rotate-left text-[12px]"></i>
            </button>
            <button id="btn-redo" class="geist-btn rounded-md" title="やり直し (⌘⇧Z)" disabled>
                <i class="fa-solid fa-rotate-right text-[12px]"></i>
            </button>
            <button id="btn-clear" class="geist-btn rounded-md text-rose-400" title="全消去">
                <i class="fa-solid fa-trash-can text-[12px]"></i>
            </button>
            <div class="relative overflow-visible">
                <button id="btn-export" class="geist-btn rounded-md" title="書き出し">
                    <i class="fa-solid fa-download text-[12px]"></i>
                </button>
                <div id="export-menu" class="hidden absolute right-0 top-full mt-1.5 w-44 geist-surface rounded-lg py-1 z-[60] text-[12px]">
                    <button data-export="png" class="w-full text-left px-3 py-2 hover:bg-white/8 flex items-center gap-2 text-geist-200">
                        <i class="fa-regular fa-image w-4"></i>PNG
                    </button>
                    <button data-export="jpeg" class="w-full text-left px-3 py-2 hover:bg-white/8 flex items-center gap-2 text-geist-200">
                        <i class="fa-regular fa-file-image w-4"></i>JPEG
                    </button>
                    <button data-export="svg" class="w-full text-left px-3 py-2 hover:bg-white/8 flex items-center gap-2 text-geist-200">
                        <i class="fa-solid fa-bezier-curve w-4"></i>SVG
                    </button>
                    <div class="h-px bg-white/10 my-1"></div>
                    <button data-export="project" class="w-full text-left px-3 py-2 hover:bg-white/8 flex items-center gap-2 text-geist-200">
                        <i class="fa-solid fa-floppy-disk w-4"></i>プロジェクト保存
                    </button>
                    <button id="btn-load-project" class="w-full text-left px-3 py-2 hover:bg-white/8 flex items-center gap-2 text-geist-200">
                        <i class="fa-solid fa-folder-open w-4"></i>読み込み
                    </button>
                    <input type="file" id="file-input" accept=".json,.svg,image/svg+xml,application/json" class="hidden">
                </div>
            </div>
        </div>
    </header>

    <!-- LEFT TOOLBAR -->
    <aside id="left-toolbar" class="absolute left-2 top-1/2 -translate-y-1/2 geist-surface p-0.5 rounded-lg flex flex-col gap-0.5 z-20 pointer-events-auto">
        <button id="tool-hand" class="geist-btn" title="移動 (H / Space)"><i class="fa-solid fa-hand text-[14px]"></i></button>
        <button id="tool-select" class="geist-btn" title="選択 (V)"><i class="fa-solid fa-arrow-pointer text-[14px]"></i></button>
        <div class="h-px w-full bg-white/10 my-0.5"></div>
        <button id="tool-brush" class="geist-btn active" title="ブラシ (B)"><i class="fa-solid fa-pen-nib text-[14px]"></i></button>
        <button id="tool-text" class="geist-btn" title="テキスト (T)"><i class="fa-solid fa-font text-[14px]"></i></button>
        <div class="relative" id="shapes-wrap">
            <button id="tool-shapes" class="geist-btn w-full" title="図形"><i id="shape-icon" class="fa-regular fa-square text-[14px]"></i></button>
            <div id="shapes-menu" class="absolute left-full top-0 ml-1 geist-surface p-0.5 rounded-lg hidden flex-col gap-0.5 z-30">
                <button data-shape="rect" class="geist-btn" title="四角形"><i class="fa-regular fa-square"></i></button>
                <button data-shape="circle" class="geist-btn" title="円"><i class="fa-regular fa-circle"></i></button>
                <button data-shape="line" class="geist-btn" title="直線"><i class="fa-solid fa-minus"></i></button>
                <button data-shape="arrow" class="geist-btn" title="矢印"><i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </div>
        <button id="tool-eraser" class="geist-btn" title="消しゴム (E)"><i class="fa-solid fa-eraser text-[14px]"></i></button>
        <button id="tool-eyedropper" class="geist-btn" title="スポイト (I)"><i class="fa-solid fa-eye-dropper text-[14px]"></i></button>
        <div class="h-px w-full bg-white/10 my-0.5"></div>
        <button id="btn-props-toggle" class="geist-btn" title="設定"><i class="fa-solid fa-sliders text-[14px]"></i></button>
        <button id="btn-grid-toggle" class="geist-btn" title="グリッド (G)"><i id="grid-icon" class="fa-solid fa-border-all text-[14px]"></i></button>
    </aside>

    <!-- PROPERTIES (hidden by default) -->
    <aside id="props-panel" class="absolute left-14 top-1/2 -translate-y-1/2 w-56 geist-surface p-2.5 rounded-lg flex-col gap-2.5 z-30 pointer-events-auto overflow-y-auto props-scroll hidden" style="max-height:70vh;">
        <div class="flex justify-between items-center">
            <span class="text-[10px] font-mono uppercase tracking-wider text-geist-500">設定</span>
            <div class="flex items-center gap-1">
                <span id="tool-badge" class="text-[10px] px-1.5 py-0.5 rounded bg-white/10 text-geist-300 font-mono">BRUSH</span>
                <button id="btn-props-close" class="geist-btn !min-w-6 !min-h-6 text-geist-400" title="閉じる">&times;</button>
            </div>
        </div>

        <div id="paint-presets" class="hidden flex-col gap-1.5">
            <label class="text-[11px] text-geist-400">ペイント</label>
            <div class="grid grid-cols-3 gap-1">
                <button class="paint-preset active geist-btn py-1.5 rounded-md text-[10px]" data-preset="pen">ペン</button>
                <button class="paint-preset geist-btn py-1.5 rounded-md text-[10px]" data-preset="marker">マーカー</button>
                <button class="paint-preset geist-btn py-1.5 rounded-md text-[10px]" data-preset="airbrush">エア</button>
            </div>
        </div>

        <div id="eraser-presets" class="hidden flex-col gap-1.5">
            <label class="text-[11px] text-geist-400">消しゴム</label>
            <div class="grid grid-cols-2 gap-1">
                <button class="eraser-mode-btn active geist-btn py-1.5 rounded-md text-[10px]" data-emode="partial">部分消し</button>
                <button class="eraser-mode-btn geist-btn py-1.5 rounded-md text-[10px]" data-emode="object">一筆消し</button>
            </div>
            <p id="eraser-hint" class="text-[10px] text-geist-500">なぞった部分だけ消します</p>
        </div>

        <div class="flex flex-col gap-1">
            <div class="flex justify-between">
                <label class="text-[11px] text-geist-400">サイズ</label>
                <span id="size-val" class="text-[11px] font-mono text-white">8</span>
            </div>
            <input id="size-slider" type="range" min="1" max="120" value="8" class="slider w-full">
        </div>

        <div class="flex flex-col gap-1">
            <div class="flex justify-between">
                <label class="text-[11px] text-geist-400">不透明度</label>
                <span id="opacity-val" class="text-[11px] font-mono text-white">100%</span>
            </div>
            <input id="opacity-slider" type="range" min="5" max="100" value="100" class="slider w-full">
        </div>

        <div class="flex flex-col gap-2 pt-1 border-t border-white/8">
            <label class="text-[11px] text-geist-400">カラー</label>
            <div class="flex items-center gap-2">
                <div class="relative shrink-0">
                    <input id="color-input" type="color" value="#171717" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10">
                    <div id="color-swatch" class="w-8 h-8 rounded-md border border-white/15" style="background:#171717"></div>
                </div>
                <div class="flex-1 flex items-center gap-1 bg-black/40 px-2 py-1 rounded-md border border-white/8">
                    <span class="text-geist-600 text-[10px] font-mono">#</span>
                    <input id="hex-input" type="text" value="171717" maxlength="6" class="bg-transparent text-[12px] text-white font-mono outline-none w-full uppercase">
                </div>
            </div>
            <div class="flex flex-col gap-1">
                <select id="palette-select" class="bg-black/40 border border-white/8 text-[10px] text-geist-300 rounded px-1.5 py-1 outline-none">
                    <option value="mono">Monochrome</option>
                    <option value="vercel">Vercel</option>
                    <option value="pastel">Pastel</option>
                    <option value="earth">Earth</option>
                    <option value="neon">Neon</option>
                </select>
                <div id="palette-grid" class="grid grid-cols-6 gap-1"></div>
            </div>
        </div>

        <div class="flex flex-col gap-1.5 pt-1 border-t border-white/8">
            <label class="text-[11px] text-geist-400">背景</label>
            <div id="center-controls" class="flex items-center gap-1.5">
                <button class="bg-picker w-5 h-5 rounded border border-white/20 bg-white" data-color="#ffffff" title="White"></button>
                <button class="bg-picker w-5 h-5 rounded border border-white/15 bg-[#F8F8FA]" data-color="#F8F8FA" title="Off-white"></button>
                <button class="bg-picker w-5 h-5 rounded border border-white/15 bg-[#F0F2F5]" data-color="#F0F2F5" title="Slate"></button>
                <button class="bg-picker w-5 h-5 rounded border border-white/15 bg-[#E8E8EC]" data-color="#E8E8EC" title="Light gray"></button>
                <button class="bg-picker w-5 h-5 rounded border border-white/25 bg-[#0A0A0A]" data-color="#0A0A0A" title="Dark"></button>
            </div>
        </div>

        <div class="flex flex-col gap-1.5 pt-1 border-t border-white/8">
            <div class="flex justify-between items-center">
                <label class="text-[11px] text-geist-400">レイヤー</label>
                <button id="btn-add-layer" class="geist-btn !min-w-6 !min-h-6" title="追加"><i class="fa-solid fa-plus text-[10px]"></i></button>
            </div>
            <div id="layer-list" class="flex flex-col gap-1 max-h-24 overflow-y-auto"></div>
        </div>

        <div id="selection-actions" class="hidden flex-col gap-1.5 pt-1 border-t border-white/8">
            <button id="btn-delete-selected" class="geist-btn py-1.5 rounded-md text-[11px] text-rose-400 w-full">
                <i class="fa-solid fa-trash-can mr-1"></i>削除
            </button>
        </div>
    </aside>

    <!-- BOTTOM HUD -->
    <footer id="bottom-hud" class="absolute bottom-2 left-2 right-2 flex items-center justify-between pointer-events-none z-20">
        <div class="geist-surface px-2 py-1 rounded-md text-[10px] font-mono text-geist-400 flex items-center gap-2 pointer-events-auto">
            <span id="hud-coords">0, 0</span>
            <span id="hud-zoom" class="text-white">100%</span>
        </div>
        <div class="geist-surface px-0.5 py-0.5 rounded-md flex items-center pointer-events-auto">
            <button id="zoom-out" class="geist-btn !min-w-7 !min-h-7 rounded" title="縮小"><i class="fa-solid fa-minus text-[10px]"></i></button>
            <button id="zoom-reset" class="geist-btn !min-w-0 px-1.5 !min-h-7 rounded text-[10px] font-mono">100%</button>
            <button id="zoom-in" class="geist-btn !min-w-7 !min-h-7 rounded" title="拡大"><i class="fa-solid fa-plus text-[10px]"></i></button>
        </div>
        <button id="btn-help" class="geist-surface px-2 py-1 rounded-md text-[10px] font-mono text-geist-400 hover:text-white pointer-events-auto">?</button>
    </footer>

    <!-- Shortcuts Modal -->
    <div id="help-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="geist-surface max-w-sm w-full rounded-xl p-5 shadow-menu">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-[13px] font-medium text-white flex items-center gap-2">
                    <i class="fa-solid fa-keyboard text-geist-400"></i>ショートカット
                </h3>
                <button id="close-help" class="text-geist-500 hover:text-white text-lg leading-none">&times;</button>
            </div>
            <div class="grid grid-cols-1 gap-1.5 text-[12px] font-mono">
                <div class="flex justify-between bg-white/5 px-2.5 py-1.5 rounded-md"><span class="text-geist-400">パン</span><span>Space + Drag</span></div>
                <div class="flex justify-between bg-white/5 px-2.5 py-1.5 rounded-md"><span class="text-geist-400">ズーム</span><span>Wheel / ⌘±</span></div>
                <div class="flex justify-between bg-white/5 px-2.5 py-1.5 rounded-md"><span class="text-geist-400">ブラシサイズ</span><span>Ctrl + Wheel</span></div>
                <div class="flex justify-between bg-white/5 px-2.5 py-1.5 rounded-md"><span class="text-geist-400">ブラシ / 消しゴム</span><span>B / E</span></div>
                <div class="flex justify-between bg-white/5 px-2.5 py-1.5 rounded-md"><span class="text-geist-400">選択 / テキスト</span><span>V / T</span></div>
                <div class="flex justify-between bg-white/5 px-2.5 py-1.5 rounded-md"><span class="text-geist-400">グリッド</span><span>G</span></div>
                <div class="flex justify-between bg-white/5 px-2.5 py-1.5 rounded-md"><span class="text-geist-400">Undo / Redo</span><span>⌘Z / ⌘⇧Z</span></div>
                <div class="flex justify-between bg-white/5 px-2.5 py-1.5 rounded-md"><span class="text-geist-400">削除</span><span>Delete / Backspace</span></div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // ===== STATE =====
        const state = {
            mode: 'vector',
            tool: 'brush',
            paintPreset: 'pen',
            zoom: 1,
            panX: 0,
            panY: 0,
            gridMode: 'grid',
            canvasBg: '#ffffff',
            color: '#171717',
            strokeWidth: 8,
            opacity: 1,
            isPanning: false,
            isDrawing: false,
            isMarquee: false,
            spacePressed: false,
            lastMouse: { x: 0, y: 0 },
            startWorld: { x: 0, y: 0 },
            marqueeStart: null,
            objects: [],
            selectedIds: new Set(),
            layers: [{ id: 'layer-1', name: 'Layer 1', visible: true }],
            activeLayerId: 'layer-1',
            undoStack: [],
            redoStack: [],
            maxHistory: 50,
            currentObj: null,
            dpr: Math.min(window.devicePixelRatio || 1, 2),
            historyLocked: false,
            eraserMode: 'partial' // 'partial' | 'object'
        };

        const palettes = {
            mono:   ['#171717','#404040','#737373','#a3a3a3','#d4d4d4','#ffffff'],
            vercel: ['#171717','#0070f3','#7928ca','#ff0080','#f5a623','#50e3c2'],
            pastel: ['#2b2d42','#ef476f','#ffd166','#06d6a0','#118ab2','#f8edeb'],
            earth:  ['#1b4332','#2d6a4f','#40916c','#52b788','#74c69d','#d8f3dc'],
            neon:   ['#0a0a0a','#00f0ff','#ff00aa','#aaff00','#ff5500','#ffffff']
        };

        const container = document.getElementById('canvas-container');
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const brushCursor = document.getElementById('brush-cursor');
        const selectionBox = document.getElementById('selection-box');
        const textEditor = document.getElementById('text-editor-container');

        function uid() {
            return 'id-' + Math.random().toString(36).slice(2, 11) + Date.now().toString(36);
        }

        // ===== RESIZE =====
        function resize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const dpr = state.dpr;
            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            render();
        }
        window.addEventListener('resize', resize);

        // ===== HISTORY (sync, stable) =====
        function cloneObjects(objs) {
            return JSON.parse(JSON.stringify(objs));
        }

        function pushHistory() {
            if (state.historyLocked) return;
            state.undoStack.push({
                objects: cloneObjects(state.objects),
                layers: JSON.parse(JSON.stringify(state.layers)),
                activeLayerId: state.activeLayerId
            });
            if (state.undoStack.length > state.maxHistory) state.undoStack.shift();
            state.redoStack = [];
            updateHistoryButtons();
        }

        function undo() {
            if (state.undoStack.length === 0) return;
            state.redoStack.push({
                objects: cloneObjects(state.objects),
                layers: JSON.parse(JSON.stringify(state.layers)),
                activeLayerId: state.activeLayerId
            });
            const snap = state.undoStack.pop();
            state.objects = snap.objects;
            state.layers = snap.layers;
            state.activeLayerId = snap.activeLayerId;
            state.selectedIds.clear();
            updateHistoryButtons();
            updateSelectionUI();
            renderLayerList();
            render();
        }

        function redo() {
            if (state.redoStack.length === 0) return;
            state.undoStack.push({
                objects: cloneObjects(state.objects),
                layers: JSON.parse(JSON.stringify(state.layers)),
                activeLayerId: state.activeLayerId
            });
            const snap = state.redoStack.pop();
            state.objects = snap.objects;
            state.layers = snap.layers;
            state.activeLayerId = snap.activeLayerId;
            state.selectedIds.clear();
            updateHistoryButtons();
            updateSelectionUI();
            renderLayerList();
            render();
        }

        function updateHistoryButtons() {
            const u = document.getElementById('btn-undo');
            const r = document.getElementById('btn-redo');
            u.disabled = state.undoStack.length === 0;
            r.disabled = state.redoStack.length === 0;
            u.style.opacity = state.undoStack.length ? '1' : '0.35';
            r.style.opacity = state.redoStack.length ? '1' : '0.35';
        }

        // ===== COORDS =====
        function screenToWorld(sx, sy) {
            return { x: (sx - state.panX) / state.zoom, y: (sy - state.panY) / state.zoom };
        }
        function worldToScreen(wx, wy) {
            return { x: wx * state.zoom + state.panX, y: wy * state.zoom + state.panY };
        }

        // ===== RENDER =====
        function drawGrid() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            ctx.save();
            ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
            ctx.fillStyle = state.canvasBg;
            ctx.fillRect(0, 0, w, h);

            if (state.gridMode === 'off') { ctx.restore(); return; }

            const step = 40 * state.zoom;
            const ox = ((state.panX % step) + step) % step;
            const oy = ((state.panY % step) + step) % step;
            const dark = state.canvasBg === '#0A0A0A';
            ctx.strokeStyle = dark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.06)';
            ctx.fillStyle = dark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.12)';
            ctx.lineWidth = 1;

            if (state.gridMode === 'grid') {
                ctx.beginPath();
                for (let x = ox; x <= w; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
                for (let y = oy; y <= h; y += step) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
                ctx.stroke();
            } else {
                const r = Math.min(1.2 * state.zoom, 1.6);
                for (let x = ox; x <= w; x += step) {
                    for (let y = oy; y <= h; y += step) {
                        ctx.beginPath();
                        ctx.arc(x, y, r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
            ctx.restore();
        }

        function drawObject(obj) {
            if (!obj) return;
            const layer = state.layers.find(l => l.id === obj.layerId);
            if (layer && !layer.visible) return;

            ctx.save();
            ctx.strokeStyle = obj.color;
            ctx.fillStyle = obj.color;
            ctx.lineWidth = obj.strokeWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.globalAlpha = obj.opacity ?? 1;
            if (obj.soft) {
                ctx.shadowBlur = obj.strokeWidth * 0.5;
                ctx.shadowColor = obj.color;
            }
            const selected = state.selectedIds.has(obj.id);

            if (obj.type === 'path' && obj.points && obj.points.length) {
                ctx.beginPath();
                ctx.moveTo(obj.points[0].x, obj.points[0].y);
                for (let i = 1; i < obj.points.length; i++) ctx.lineTo(obj.points[i].x, obj.points[i].y);
                ctx.stroke();
            } else if (obj.type === 'rect') {
                ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
            } else if (obj.type === 'circle') {
                const r = Math.hypot(obj.w, obj.h);
                ctx.beginPath();
                ctx.arc(obj.x, obj.y, Math.max(0.5, r), 0, Math.PI * 2);
                ctx.stroke();
            } else if (obj.type === 'line' || obj.type === 'arrow') {
                ctx.beginPath();
                ctx.moveTo(obj.x1, obj.y1);
                ctx.lineTo(obj.x2, obj.y2);
                ctx.stroke();
                if (obj.type === 'arrow') {
                    const angle = Math.atan2(obj.y2 - obj.y1, obj.x2 - obj.x1);
                    const head = Math.max(10, obj.strokeWidth * 2.2);
                    ctx.beginPath();
                    ctx.moveTo(obj.x2, obj.y2);
                    ctx.lineTo(obj.x2 - head * Math.cos(angle - 0.4), obj.y2 - head * Math.sin(angle - 0.4));
                    ctx.moveTo(obj.x2, obj.y2);
                    ctx.lineTo(obj.x2 - head * Math.cos(angle + 0.4), obj.y2 - head * Math.sin(angle + 0.4));
                    ctx.stroke();
                }
            } else if (obj.type === 'text') {
                ctx.font = `${obj.fontSize || 22}px Inter, system-ui, sans-serif`;
                ctx.fillText(obj.text, obj.x, obj.y);
            }

            if (selected) {
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
                ctx.strokeStyle = '#0070f3';
                ctx.lineWidth = 1.5 / state.zoom;
                ctx.setLineDash([4 / state.zoom, 3 / state.zoom]);
                const b = getBounds(obj);
                if (b) ctx.strokeRect(b.x - 3, b.y - 3, b.w + 6, b.h + 6);
            }
            ctx.restore();
        }

        function getBounds(obj) {
            if (obj.type === 'path' && obj.points && obj.points.length) {
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                obj.points.forEach(p => {
                    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
                    maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
                });
                const pad = (obj.strokeWidth || 4) / 2;
                return { x: minX - pad, y: minY - pad, w: maxX - minX + pad * 2, h: maxY - minY + pad * 2 };
            }
            if (obj.type === 'rect') {
                const x = Math.min(obj.x, obj.x + obj.w);
                const y = Math.min(obj.y, obj.y + obj.h);
                return { x, y, w: Math.abs(obj.w), h: Math.abs(obj.h) };
            }
            if (obj.type === 'circle') {
                const r = Math.hypot(obj.w, obj.h);
                return { x: obj.x - r, y: obj.y - r, w: r * 2, h: r * 2 };
            }
            if (obj.type === 'line' || obj.type === 'arrow') {
                const x = Math.min(obj.x1, obj.x2), y = Math.min(obj.y1, obj.y2);
                return { x, y, w: Math.abs(obj.x2 - obj.x1) || 1, h: Math.abs(obj.y2 - obj.y1) || 1 };
            }
            if (obj.type === 'text') {
                return { x: obj.x, y: obj.y - (obj.fontSize || 22), w: Math.max(40, (obj.text || '').length * (obj.fontSize || 22) * 0.55), h: obj.fontSize || 22 };
            }
            return null;
        }

        function render() {
            drawGrid();
            ctx.save();
            ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
            ctx.translate(state.panX, state.panY);
            ctx.scale(state.zoom, state.zoom);
            state.objects.forEach(drawObject);
            ctx.restore();
            document.getElementById('hud-zoom').textContent = Math.round(state.zoom * 100) + '%';
        }

        // ===== HIT TEST =====
        function distToSegment(px, py, x1, y1, x2, y2) {
            const dx = x2 - x1, dy = y2 - y1;
            const len2 = dx * dx + dy * dy || 1;
            const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2));
            return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
        }

        function hitTest(obj, x, y) {
            const tol = Math.max(8, (obj.strokeWidth || 4) / 2 + 6);
            if (obj.type === 'path' && obj.points) {
                for (let i = 1; i < obj.points.length; i++) {
                    const a = obj.points[i - 1], b = obj.points[i];
                    if (distToSegment(x, y, a.x, a.y, b.x, b.y) < tol) return true;
                }
                return false;
            }
            if (obj.type === 'rect') {
                const minX = Math.min(obj.x, obj.x + obj.w), maxX = Math.max(obj.x, obj.x + obj.w);
                const minY = Math.min(obj.y, obj.y + obj.h), maxY = Math.max(obj.y, obj.y + obj.h);
                // stroke only roughly
                const inside = x >= minX && x <= maxX && y >= minY && y <= maxY;
                const deep = x >= minX + tol && x <= maxX - tol && y >= minY + tol && y <= maxY - tol;
                return inside && !deep || (
                    Math.abs(x - minX) < tol && y >= minY - tol && y <= maxY + tol ||
                    Math.abs(x - maxX) < tol && y >= minY - tol && y <= maxY + tol ||
                    Math.abs(y - minY) < tol && x >= minX - tol && x <= maxX + tol ||
                    Math.abs(y - maxY) < tol && x >= minX - tol && x <= maxX + tol
                );
            }
            if (obj.type === 'circle') {
                const r = Math.hypot(obj.w, obj.h);
                const d = Math.hypot(x - obj.x, y - obj.y);
                return Math.abs(d - r) < tol;
            }
            if (obj.type === 'line' || obj.type === 'arrow') {
                return distToSegment(x, y, obj.x1, obj.y1, obj.x2, obj.y2) < tol;
            }
            if (obj.type === 'text') {
                const b = getBounds(obj);
                return b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
            }
            return false;
        }

        function eraseObjectAt(wx, wy) {
            const before = state.objects.length;
            state.objects = state.objects.filter(obj => {
                const layer = state.layers.find(l => l.id === obj.layerId);
                if (layer && !layer.visible) return true;
                return !hitTest(obj, wx, wy);
            });
            return state.objects.length !== before;
        }

        // Partial erase: carve out points within radius, split paths into fragments
        function erasePartialAt(wx, wy) {
            const radius = Math.max(state.strokeWidth * 0.55, 4);
            let changed = false;
            const next = [];

            state.objects.forEach(obj => {
                const layer = state.layers.find(l => l.id === obj.layerId);
                if (layer && !layer.visible) {
                    next.push(obj);
                    return;
                }

                // Non-path shapes: only remove if eraser center is very close (optional soft object delete)
                if (obj.type !== 'path' || !obj.points || obj.points.length < 2) {
                    // shapes stay unless fully hit with object mode; partial leaves them
                    next.push(obj);
                    return;
                }

                // Split path into keep-segments outside the eraser circle
                const segments = [];
                let current = [];

                for (let i = 0; i < obj.points.length; i++) {
                    const p = obj.points[i];
                    const inside = Math.hypot(p.x - wx, p.y - wy) <= radius;
                    // also erase if the segment crosses the circle
                    let segInside = inside;
                    if (!inside && i > 0) {
                        const prev = obj.points[i - 1];
                        if (distToSegment(wx, wy, prev.x, prev.y, p.x, p.y) <= radius) {
                            segInside = true;
                        }
                    }
                    if (segInside) {
                        if (current.length >= 2) segments.push(current);
                        current = [];
                        changed = true;
                    } else {
                        current.push({ x: p.x, y: p.y });
                    }
                }
                if (current.length >= 2) segments.push(current);
                else if (current.length > 0) changed = true;

                if (segments.length === 0) {
                    changed = true;
                    return; // fully erased
                }

                // first segment reuses original id when possible
                segments.forEach((pts, idx) => {
                    if (idx === 0 && segments.length === 1 && pts.length === obj.points.length) {
                        next.push(obj); // unchanged
                    } else {
                        next.push({
                            ...obj,
                            id: idx === 0 ? obj.id : uid(),
                            points: pts
                        });
                        changed = true;
                    }
                });
            });

            if (changed) state.objects = next;
            return changed;
        }

        function eraseAt(wx, wy) {
            if (state.eraserMode === 'object') return eraseObjectAt(wx, wy);
            return erasePartialAt(wx, wy);
        }

        // ===== TOOLS =====
        function setTool(name) {
            state.tool = name;
            document.querySelectorAll('[id^="tool-"]').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('tool-' + (['rect','circle','line','arrow'].includes(name) ? 'shapes' : name));
            if (btn) btn.classList.add('active');
            document.getElementById('tool-badge').textContent = name.toUpperCase();
            container.style.cursor = name === 'hand' ? 'grab' : name === 'text' ? 'text' : 'crosshair';
            if (['rect','circle','line','arrow'].includes(name)) {
                const icons = { rect: 'fa-regular fa-square', circle: 'fa-regular fa-circle', line: 'fa-solid fa-minus', arrow: 'fa-solid fa-arrow-right' };
                document.getElementById('shape-icon').className = icons[name] + ' text-[15px]';
            }
            // show eraser mode panel
            const ep = document.getElementById('eraser-presets');
            if (ep) {
                ep.classList.toggle('hidden', name !== 'eraser');
                ep.classList.toggle('flex', name === 'eraser');
            }
            updateCursor();
        }

        function setMode(m) {
            state.mode = m;
            document.getElementById('mode-vector-btn').classList.toggle('active', m === 'vector');
            document.getElementById('mode-paint-btn').classList.toggle('active', m === 'paint');
            document.getElementById('paint-presets').classList.toggle('hidden', m !== 'paint');
            document.getElementById('paint-presets').classList.toggle('flex', m === 'paint');
        }

        function setColor(hex) {
            if (!hex.startsWith('#')) hex = '#' + hex;
            if (!/^#[0-9A-Fa-f]{6}$/.test(hex)) return;
            state.color = hex.toLowerCase();
            document.getElementById('color-input').value = hex;
            document.getElementById('color-swatch').style.background = hex;
            document.getElementById('hex-input').value = hex.slice(1).toUpperCase();
            document.querySelectorAll('.swatch').forEach(s => {
                s.classList.toggle('active', s.dataset.hex === hex.toLowerCase());
            });
        }

        function renderPalette(name) {
            const grid = document.getElementById('palette-grid');
            grid.innerHTML = '';
            (palettes[name] || palettes.mono).forEach(hex => {
                const b = document.createElement('button');
                b.className = 'swatch' + (hex.toLowerCase() === state.color ? ' active' : '');
                b.style.background = hex;
                b.dataset.hex = hex.toLowerCase();
                b.addEventListener('click', () => setColor(hex));
                grid.appendChild(b);
            });
        }

        // ===== LAYERS UI =====
        function renderLayerList() {
            const list = document.getElementById('layer-list');
            list.innerHTML = '';
            [...state.layers].reverse().forEach(layer => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-1.5 px-1.5 py-1 rounded-md text-[11px] cursor-pointer ' +
                    (layer.id === state.activeLayerId ? 'bg-white/10 text-white' : 'text-geist-400 hover:bg-white/5');
                row.innerHTML = `
                    <button class="layer-vis w-5 h-5 flex items-center justify-center" data-id="${layer.id}" title="表示切替">
                        <i class="fa-solid ${layer.visible ? 'fa-eye' : 'fa-eye-slash'} text-[10px]"></i>
                    </button>
                    <span class="flex-1 truncate layer-name" data-id="${layer.id}">${layer.name}</span>
                `;
                row.querySelector('.layer-name').onclick = () => {
                    state.activeLayerId = layer.id;
                    renderLayerList();
                };
                row.querySelector('.layer-vis').onclick = (e) => {
                    e.stopPropagation();
                    layer.visible = !layer.visible;
                    renderLayerList();
                    render();
                };
                list.appendChild(row);
            });
        }

        // ===== INTERACTION =====
        function getPos(e) {
            const r = canvas.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
        }

        container.addEventListener('pointerdown', (e) => {
            if (e.button === 2) return;
            // don't start draw if text editor open
            if (textEditor.style.display === 'block') return;

            try { container.setPointerCapture(e.pointerId); } catch (_) {}
            const pos = getPos(e);
            const world = screenToWorld(pos.x, pos.y);
            state.lastMouse = pos;
            state.startWorld = world;

            if (state.tool === 'hand' || state.spacePressed || e.button === 1) {
                state.isPanning = true;
                container.style.cursor = 'grabbing';
                return;
            }

            if (state.tool === 'eyedropper') {
                const px = ctx.getImageData(
                    Math.floor(pos.x * state.dpr),
                    Math.floor(pos.y * state.dpr), 1, 1
                ).data;
                setColor('#' + [px[0], px[1], px[2]].map(v => v.toString(16).padStart(2, '0')).join(''));
                setTool('brush');
                return;
            }

            if (state.tool === 'text') {
                spawnText(world.x, world.y);
                return;
            }

            if (state.tool === 'select') {
                // marquee or click
                let hit = null;
                for (let i = state.objects.length - 1; i >= 0; i--) {
                    if (hitTest(state.objects[i], world.x, world.y)) { hit = state.objects[i]; break; }
                }
                if (hit) {
                    if (e.shiftKey) {
                        if (state.selectedIds.has(hit.id)) state.selectedIds.delete(hit.id);
                        else state.selectedIds.add(hit.id);
                    } else if (!state.selectedIds.has(hit.id)) {
                        state.selectedIds.clear();
                        state.selectedIds.add(hit.id);
                    }
                    updateSelectionUI();
                    render();
                    // drag move selected
                    state.isDrawing = true;
                    state._dragMove = true;
                    state._dragStart = world;
                    state._origPositions = {};
                    state.objects.forEach(o => {
                        if (state.selectedIds.has(o.id)) {
                            state._origPositions[o.id] = JSON.parse(JSON.stringify(o));
                        }
                    });
                } else {
                    if (!e.shiftKey) state.selectedIds.clear();
                    state.isMarquee = true;
                    state.marqueeStart = { x: pos.x, y: pos.y };
                    selectionBox.style.display = 'block';
                    selectionBox.style.left = pos.x + 'px';
                    selectionBox.style.top = pos.y + 'px';
                    selectionBox.style.width = '0';
                    selectionBox.style.height = '0';
                    updateSelectionUI();
                    render();
                }
                return;
            }

            if (state.tool === 'eraser') {
                state.isDrawing = true;
                state._erased = eraseAt(world.x, world.y);
                render();
                return;
            }

            // Drawing tools
            state.isDrawing = true;
            const base = {
                id: uid(),
                layerId: state.activeLayerId,
                color: state.color,
                strokeWidth: state.strokeWidth,
                opacity: state.mode === 'paint' && state.paintPreset === 'marker' ? state.opacity * 0.55 : state.opacity,
                soft: state.mode === 'paint' && state.paintPreset === 'airbrush'
            };

            if (state.tool === 'brush') {
                state.currentObj = { ...base, type: 'path', points: [{ x: world.x, y: world.y }] };
                state.objects.push(state.currentObj);
            } else if (state.tool === 'rect' || state.tool === 'circle') {
                state.currentObj = { ...base, type: state.tool, x: world.x, y: world.y, w: 0, h: 0 };
                state.objects.push(state.currentObj);
            } else if (state.tool === 'line' || state.tool === 'arrow') {
                state.currentObj = { ...base, type: state.tool, x1: world.x, y1: world.y, x2: world.x, y2: world.y };
                state.objects.push(state.currentObj);
            }
            render();
        });

        container.addEventListener('pointermove', (e) => {
            const pos = getPos(e);
            const world = screenToWorld(pos.x, pos.y);
            document.getElementById('hud-coords').textContent = `${Math.round(world.x)}, ${Math.round(world.y)}`;
            updateCursor(pos.x, pos.y);

            if (state.isPanning) {
                state.panX += pos.x - state.lastMouse.x;
                state.panY += pos.y - state.lastMouse.y;
                state.lastMouse = pos;
                render();
                return;
            }

            if (state.isMarquee && state.marqueeStart) {
                const x = Math.min(state.marqueeStart.x, pos.x);
                const y = Math.min(state.marqueeStart.y, pos.y);
                const w = Math.abs(pos.x - state.marqueeStart.x);
                const h = Math.abs(pos.y - state.marqueeStart.y);
                selectionBox.style.left = x + 'px';
                selectionBox.style.top = y + 'px';
                selectionBox.style.width = w + 'px';
                selectionBox.style.height = h + 'px';
                return;
            }

            if (!state.isDrawing) return;

            if (state._dragMove && state._origPositions) {
                const dx = world.x - state._dragStart.x;
                const dy = world.y - state._dragStart.y;
                state.objects.forEach(o => {
                    if (!state.selectedIds.has(o.id)) return;
                    const orig = state._origPositions[o.id];
                    if (!orig) return;
                    if (o.type === 'path') {
                        o.points = orig.points.map(p => ({ x: p.x + dx, y: p.y + dy }));
                    } else if (o.type === 'rect' || o.type === 'circle') {
                        o.x = orig.x + dx; o.y = orig.y + dy;
                    } else if (o.type === 'line' || o.type === 'arrow') {
                        o.x1 = orig.x1 + dx; o.y1 = orig.y1 + dy;
                        o.x2 = orig.x2 + dx; o.y2 = orig.y2 + dy;
                    } else if (o.type === 'text') {
                        o.x = orig.x + dx; o.y = orig.y + dy;
                    }
                });
                render();
                return;
            }

            if (state.tool === 'eraser') {
                if (eraseAt(world.x, world.y)) state._erased = true;
                render();
                return;
            }

            if (state.currentObj) {
                if (state.currentObj.type === 'path') {
                    const pts = state.currentObj.points;
                    const last = pts[pts.length - 1];
                    if (Math.hypot(world.x - last.x, world.y - last.y) > 1.5 / state.zoom) {
                        pts.push({ x: world.x, y: world.y });
                    }
                } else if (state.currentObj.type === 'rect' || state.currentObj.type === 'circle') {
                    state.currentObj.w = world.x - state.startWorld.x;
                    state.currentObj.h = world.y - state.startWorld.y;
                } else if (state.currentObj.type === 'line' || state.currentObj.type === 'arrow') {
                    state.currentObj.x2 = world.x;
                    state.currentObj.y2 = world.y;
                }
                render();
            }
        });

        function endPointer() {
            if (state.isPanning) {
                state.isPanning = false;
                container.style.cursor = state.tool === 'hand' ? 'grab' : 'crosshair';
            }

            if (state.isMarquee && state.marqueeStart) {
                const r = selectionBox.getBoundingClientRect();
                const cr = canvas.getBoundingClientRect();
                const x1 = r.left - cr.left, y1 = r.top - cr.top;
                const x2 = x1 + r.width, y2 = y1 + r.height;
                const w1 = screenToWorld(x1, y1);
                const w2 = screenToWorld(x2, y2);
                const minX = Math.min(w1.x, w2.x), maxX = Math.max(w1.x, w2.x);
                const minY = Math.min(w1.y, w2.y), maxY = Math.max(w1.y, w2.y);
                if (maxX - minX > 4 || maxY - minY > 4) {
                    state.objects.forEach(o => {
                        const b = getBounds(o);
                        if (!b) return;
                        const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
                        if (cx >= minX && cx <= maxX && cy >= minY && cy <= maxY) {
                            state.selectedIds.add(o.id);
                        }
                    });
                    updateSelectionUI();
                    render();
                }
                selectionBox.style.display = 'none';
                state.isMarquee = false;
                state.marqueeStart = null;
            }

            if (state.isDrawing) {
                if (state._dragMove) {
                    pushHistory();
                } else if (state.tool === 'eraser') {
                    if (state._erased) pushHistory();
                } else if (state.currentObj) {
                    // drop tiny accidental strokes
                    if (state.currentObj.type === 'path' && state.currentObj.points.length < 2) {
                        state.objects = state.objects.filter(o => o.id !== state.currentObj.id);
                    } else {
                        pushHistory();
                    }
                }
            }

            state.isDrawing = false;
            state.currentObj = null;
            state._dragMove = false;
            state._origPositions = null;
            state._erased = false;
        }

        window.addEventListener('pointerup', endPointer);
        window.addEventListener('pointercancel', endPointer);

        // Zoom / size
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.ctrlKey || e.metaKey) {
                const d = e.deltaY < 0 ? 2 : -2;
                state.strokeWidth = Math.max(1, Math.min(120, state.strokeWidth + d));
                document.getElementById('size-slider').value = state.strokeWidth;
                document.getElementById('size-val').textContent = state.strokeWidth;
                updateCursor();
                return;
            }
            const factor = e.deltaY < 0 ? 1.09 : 1 / 1.09;
            const mx = e.clientX - canvas.getBoundingClientRect().left;
            const my = e.clientY - canvas.getBoundingClientRect().top;
            const before = screenToWorld(mx, my);
            state.zoom = Math.min(16, Math.max(0.08, state.zoom * factor));
            const after = screenToWorld(mx, my);
            state.panX += (after.x - before.x) * state.zoom;
            state.panY += (after.y - before.y) * state.zoom;
            render();
        }, { passive: false });

        function updateCursor(x, y) {
            if (x === undefined) { x = state.lastMouse.x; y = state.lastMouse.y; }
            if (['brush', 'eraser'].includes(state.tool)) {
                brushCursor.style.display = 'block';
                const r = Math.max(4, state.strokeWidth * state.zoom);
                brushCursor.style.width = r + 'px';
                brushCursor.style.height = r + 'px';
                brushCursor.style.left = x + 'px';
                brushCursor.style.top = y + 'px';
                brushCursor.style.borderColor = state.tool === 'eraser' ? 'rgba(239,68,68,0.9)' : 'rgba(0,0,0,0.75)';
            } else {
                brushCursor.style.display = 'none';
            }
        }

        function updateSelectionUI() {
            const el = document.getElementById('selection-actions');
            el.classList.toggle('hidden', state.selectedIds.size === 0);
            el.classList.toggle('flex', state.selectedIds.size > 0);
        }

        // ===== TEXT =====
        function spawnText(wx, wy) {
            const sp = worldToScreen(wx, wy);
            textEditor.style.display = 'block';
            textEditor.style.left = Math.max(8, sp.x) + 'px';
            textEditor.style.top = Math.max(8, sp.y) + 'px';
            textEditor.style.pointerEvents = 'auto';
            textEditor.innerHTML = '';
            const ta = document.createElement('textarea');
            ta.className = 'text-editor-input';
            ta.style.color = state.color;
            ta.style.fontSize = Math.max(16, 22 * state.zoom) + 'px';
            ta.placeholder = 'テキストを入力…';
            ta.rows = 2;
            textEditor.appendChild(ta);
            // focus after layout
            requestAnimationFrame(() => ta.focus());

            let committed = false;
            const commit = () => {
                if (committed) return;
                committed = true;
                const v = ta.value.trim();
                if (v) {
                    state.objects.push({
                        id: uid(),
                        type: 'text',
                        text: v,
                        x: wx,
                        y: wy,
                        color: state.color,
                        fontSize: 22,
                        opacity: state.opacity,
                        layerId: state.activeLayerId
                    });
                    pushHistory();
                    render();
                }
                textEditor.style.display = 'none';
                textEditor.style.pointerEvents = 'none';
                textEditor.innerHTML = '';
            };
            ta.addEventListener('blur', () => setTimeout(commit, 50));
            ta.addEventListener('keydown', (e) => {
                e.stopPropagation();
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ta.blur(); }
                if (e.key === 'Escape') { ta.value = ''; ta.blur(); }
            });
            ta.addEventListener('pointerdown', (e) => e.stopPropagation());
        }

        // ===== EXPORT / PROJECT =====
        function exportRaster(type) {
            const w = canvas.width, h = canvas.height;
            const tmp = document.createElement('canvas');
            tmp.width = w; tmp.height = h;
            const t = tmp.getContext('2d');
            t.fillStyle = state.canvasBg;
            t.fillRect(0, 0, w, h);
            // redraw scene at current view
            t.save();
            t.scale(state.dpr, state.dpr);
            t.translate(state.panX, state.panY);
            t.scale(state.zoom, state.zoom);
            state.objects.forEach(obj => {
                // reuse draw by temporarily swapping ctx — simpler: drawImage main after render
            });
            t.restore();
            // easiest: copy current main canvas (already has bg+content)
            render();
            t.drawImage(canvas, 0, 0);
            const link = document.createElement('a');
            link.download = `infinite-studio.${type === 'jpeg' ? 'jpg' : 'png'}`;
            link.href = tmp.toDataURL(type === 'jpeg' ? 'image/jpeg' : 'image/png', 0.92);
            link.click();
        }

        function exportSVG() {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            const grow = (x, y) => { minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x); maxY = Math.max(maxY, y); };
            state.objects.forEach(o => {
                const b = getBounds(o);
                if (b) { grow(b.x, b.y); grow(b.x + b.w, b.y + b.h); }
            });
            if (!isFinite(minX)) { minX = 0; minY = 0; maxX = 800; maxY = 600; }
            const pad = 24;
            minX -= pad; minY -= pad; maxX += pad; maxY += pad;
            let svg = `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${maxX - minX}" height="${maxY - minY}" viewBox="${minX} ${minY} ${maxX - minX} ${maxY - minY}">\n`;
            svg += `<rect x="${minX}" y="${minY}" width="${maxX - minX}" height="${maxY - minY}" fill="${state.canvasBg}"/>\n`;
            state.objects.forEach(o => {
                const op = o.opacity ?? 1;
                if (o.type === 'path' && o.points && o.points.length) {
                    const d = o.points.map((p, i) => (i ? 'L' : 'M') + p.x + ',' + p.y).join(' ');
                    svg += `<path d="${d}" fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"/>\n`;
                } else if (o.type === 'rect') {
                    svg += `<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" opacity="${op}"/>\n`;
                } else if (o.type === 'circle') {
                    const r = Math.hypot(o.w, o.h);
                    svg += `<circle cx="${o.x}" cy="${o.y}" r="${r}" fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" opacity="${op}"/>\n`;
                } else if (o.type === 'line' || o.type === 'arrow') {
                    svg += `<line x1="${o.x1}" y1="${o.y1}" x2="${o.x2}" y2="${o.y2}" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" opacity="${op}"/>\n`;
                } else if (o.type === 'text') {
                    const esc = (o.text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    svg += `<text x="${o.x}" y="${o.y}" fill="${o.color}" font-size="${o.fontSize || 22}" font-family="Inter,system-ui,sans-serif" opacity="${op}">${esc}</text>\n`;
                }
            });
            svg += '</svg>';
            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const link = document.createElement('a');
            link.download = 'infinite-studio.svg';
            link.href = URL.createObjectURL(blob);
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        }

        function saveProject() {
            const data = {
                version: 1,
                canvasBg: state.canvasBg,
                gridMode: state.gridMode,
                objects: state.objects,
                layers: state.layers,
                activeLayerId: state.activeLayerId
            };
            const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const link = document.createElement('a');
            link.download = 'infinite-studio.json';
            link.href = URL.createObjectURL(blob);
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        }

        function loadProjectFile(file) {
            const reader = new FileReader();
            reader.onload = () => {
                const text = reader.result;
                try {
                    if (file.name.endsWith('.json') || text.trim().startsWith('{')) {
                        const data = JSON.parse(text);
                        state.objects = data.objects || [];
                        state.layers = data.layers || [{ id: 'layer-1', name: 'Layer 1', visible: true }];
                        state.activeLayerId = data.activeLayerId || state.layers[0].id;
                        if (data.canvasBg) state.canvasBg = data.canvasBg;
                        if (data.gridMode) state.gridMode = data.gridMode;
                        state.selectedIds.clear();
                        state.undoStack = [];
                        state.redoStack = [];
                        pushHistory();
                        updateHistoryButtons();
                        updateSelectionUI();
                        renderLayerList();
                        render();
                    } else {
                        // SVG
                        parseSVG(text);
                    }
                } catch (err) {
                    alert('読み込みに失敗しました: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function parseSVG(text) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(text, 'image/svg+xml');
            const svg = doc.querySelector('svg');
            if (!svg) { alert('SVGを解析できません'); return; }
            const newObjs = [];
            const layerId = state.activeLayerId;

            svg.querySelectorAll('path').forEach(el => {
                const d = el.getAttribute('d') || '';
                const points = [];
                const re = /[ML]\s*(-?[\d.]+)[,\s]+(-?[\d.]+)/gi;
                let m;
                while ((m = re.exec(d))) points.push({ x: +m[1], y: +m[2] });
                if (points.length) {
                    newObjs.push({
                        id: uid(), type: 'path', points, layerId,
                        color: el.getAttribute('stroke') || '#171717',
                        strokeWidth: parseFloat(el.getAttribute('stroke-width')) || 2,
                        opacity: parseFloat(el.getAttribute('opacity')) || 1
                    });
                }
            });
            svg.querySelectorAll('rect').forEach(el => {
                if (el.getAttribute('fill') && el.getAttribute('fill') !== 'none' && !el.getAttribute('stroke')) return; // bg skip rough
                newObjs.push({
                    id: uid(), type: 'rect', layerId,
                    x: parseFloat(el.getAttribute('x')) || 0,
                    y: parseFloat(el.getAttribute('y')) || 0,
                    w: parseFloat(el.getAttribute('width')) || 0,
                    h: parseFloat(el.getAttribute('height')) || 0,
                    color: el.getAttribute('stroke') || '#171717',
                    strokeWidth: parseFloat(el.getAttribute('stroke-width')) || 2,
                    opacity: parseFloat(el.getAttribute('opacity')) || 1
                });
            });
            svg.querySelectorAll('circle').forEach(el => {
                const r = parseFloat(el.getAttribute('r')) || 0;
                newObjs.push({
                    id: uid(), type: 'circle', layerId,
                    x: parseFloat(el.getAttribute('cx')) || 0,
                    y: parseFloat(el.getAttribute('cy')) || 0,
                    w: r, h: 0,
                    color: el.getAttribute('stroke') || '#171717',
                    strokeWidth: parseFloat(el.getAttribute('stroke-width')) || 2,
                    opacity: parseFloat(el.getAttribute('opacity')) || 1
                });
            });
            svg.querySelectorAll('line').forEach(el => {
                newObjs.push({
                    id: uid(), type: 'line', layerId,
                    x1: parseFloat(el.getAttribute('x1')) || 0,
                    y1: parseFloat(el.getAttribute('y1')) || 0,
                    x2: parseFloat(el.getAttribute('x2')) || 0,
                    y2: parseFloat(el.getAttribute('y2')) || 0,
                    color: el.getAttribute('stroke') || '#171717',
                    strokeWidth: parseFloat(el.getAttribute('stroke-width')) || 2,
                    opacity: parseFloat(el.getAttribute('opacity')) || 1
                });
            });
            svg.querySelectorAll('text').forEach(el => {
                newObjs.push({
                    id: uid(), type: 'text', layerId,
                    x: parseFloat(el.getAttribute('x')) || 0,
                    y: parseFloat(el.getAttribute('y')) || 0,
                    text: el.textContent || '',
                    fontSize: parseFloat(el.getAttribute('font-size')) || 22,
                    color: el.getAttribute('fill') || '#171717',
                    opacity: parseFloat(el.getAttribute('opacity')) || 1
                });
            });

            if (!newObjs.length) { alert('読み込める図形が見つかりませんでした'); return; }
            state.objects = state.objects.concat(newObjs);
            pushHistory();
            render();
        }

        // Keyboard
        window.addEventListener('keydown', (e) => {

            if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
            if ((e.metaKey || e.ctrlKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
            if (e.key === 'g' || e.key === 'G') document.getElementById('btn-grid-toggle').click();

        // Props panel toggle (default closed — more canvas space)

        function openProps() {

        function closeProps() {
            propsPanel.classList.add('hidden');
            propsPanel.classList.remove('flex', 'open');
            propsToggle.classList.remove('active');
        }
        if (propsToggle) {
            propsToggle.onclick = (e) => {
                e.stopPropagation();
                if (propsPanel.classList.contains('hidden')) openProps();
                else closeProps();
            };
        }
        if (propsClose) propsClose.onclick = (e) => { e.stopPropagation(); closeProps(); };
        // Close when starting to draw on canvas
        container.addEventListener('pointerdown', () => {
            if (!propsPanel.classList.contains('hidden')) closeProps();
        });

        // Init
        renderPalette('mono');
        setColor('#171717');
        renderLayerList();
        resize();
        pushHistory();
        updateHistoryButtons();
    });
    </script>
</body>
</html>
