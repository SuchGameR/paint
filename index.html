<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        geist: {
                            50: '#fafafa', 100: '#f5f5f5', 200: '#e5e5e5', 300: '#d4d4d4',
                            400: '#a3a3a3', 500: '#737373', 600: '#525252', 700: '#404040',
                            800: '#262626', 900: '#171717', 950: '#0a0a0a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Geist', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['Geist Mono', 'ui-monospace', 'SFMono-Regular', 'Roboto Mono', 'monospace']
                    },
                    boxShadow: {
                        'border': '0 0 0 1px rgba(255,255,255,0.08)',
                        'border-strong': '0 0 0 1px rgba(255,255,255,0.14)',
                        'elevated': '0 0 0 1px rgba(255,255,255,0.08), 0 8px 24px rgba(0,0,0,0.4)',
                        'menu': '0 0 0 1px rgba(255,255,255,0.1), 0 16px 48px rgba(0,0,0,0.55)'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Inter', system-ui, sans-serif;
            background: #000;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
        .geist-surface {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.09);
        }
        .geist-btn {
            background: transparent;
            border: none;
            color: #a3a3a3;
            transition: color 0.12s ease, background 0.12s ease;
            border-radius: 6px;
            min-width: 36px;
            min-height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .geist-btn:hover {
            background: rgba(255,255,255,0.08);
            color: #fafafa;
        }
        .geist-btn:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 1px;
        }
        .geist-btn.active {
            background: #fafafa;
            color: #0a0a0a;
            font-weight: 500;
        }
        .geist-btn.active:hover {
            background: #e5e5e5;
            color: #0a0a0a;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        #brush-cursor {
            pointer-events: none;
            position: absolute;
            border: 1.5px solid rgba(0,0,0,0.75);
            box-shadow: 0 0 0 1.5px rgba(255,255,255,0.95);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 9999;
            transition: width 0.03s linear, height 0.03s linear;
            will-change: width, height, left, top;
        }
        .text-editor-input {
            background: rgba(255,255,255,0.92);
            border: 1px dashed #171717;
            outline: none;
            resize: none;
            overflow: hidden;
            font-family: inherit;
            padding: 4px 6px;
            white-space: pre;
            border-radius: 4px;
            min-width: 120px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            font-size: 16px; /* prevent iOS zoom */
        }
        .mode-toggle {
            background: rgba(255,255,255,0.06);
            border-radius: 7px;
            padding: 2px;
        }
        .mode-toggle-btn {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.12s ease;
            color: #737373;
            min-height: 28px;
        }
        .mode-toggle-btn.active {
            background: #fafafa;
            color: #0a0a0a;
            font-weight: 600;
        }
        .swatch {
            width: 24px;
            height: 24px;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.12);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            cursor: pointer;
        }
        .swatch:hover, .swatch:active {
            transform: scale(1.1);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.3);
        }
        .swatch.active {
            box-shadow: 0 0 0 2px #fff;
        }
        .slider {
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: #262626;
            border-radius: 2px;
            outline: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fafafa;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.3);
        }
        .slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fafafa;
            cursor: pointer;
            border: none;
        }
        .props-scroll::-webkit-scrollbar { width: 4px; }
        .props-scroll::-webkit-scrollbar-track { background: transparent; }
        .props-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        .selection-box {
            position: absolute;
            border: 1px solid #0070f3;
            background: rgba(0,112,243,0.08);
            pointer-events: none;
            z-index: 5;
            display: none;
        }

        /* ===== Mobile / compact layout ===== */
        @media (max-width: 768px) {
            .geist-btn {
                min-width: 42px;
                min-height: 42px;
            }
            .swatch {
                width: 28px;
                height: 28px;
            }
            .slider::-webkit-slider-thumb {
                width: 20px;
                height: 20px;
            }
            .slider::-moz-range-thumb {
                width: 20px;
                height: 20px;
            }
            /* Hide less critical labels on very small screens */
            .hide-sm { display: none !important; }
            /* Properties panel becomes bottom sheet style on mobile */
            #props-panel {
                top: auto !important;
                bottom: 56px !important;
                right: 6px !important;
                left: 54px !important;
                width: auto !important;
                max-height: 36vh;
                border-radius: 12px;
                display: none;
            }
            #props-panel.open {
                display: flex !important;
            }
            /* Left toolbar sits lower and tighter */
            #left-toolbar {
                left: 6px !important;
                top: auto !important;
                bottom: 56px !important;
                transform: none !important;
            }
            #btn-props-toggle {
                display: inline-flex !important;
            }
            /* Top bar tighter */
            #top-bar {
                top: 6px !important;
                left: 6px !important;
                right: 6px !important;
                gap: 6px !important;
            }
            #top-bar > div {
                padding-left: 8px !important;
                padding-right: 8px !important;
            }
            /* Bottom HUD */
            #bottom-hud {
                bottom: 6px !important;
                left: 6px !important;
                right: 6px !important;
            }
            /* Compact mode toggle text */
            .mode-toggle-btn span { display: none; }
            .mode-toggle-btn { padding: 6px 8px; }
        }

        @media (max-width: 480px) {
            #center-controls { display: none !important; }
            #export-label { display: none; }
        }
    </style>
</head>
<body class="bg-black text-gray-100 h-screen w-screen relative overflow-hidden">

    <!-- Canvas -->
    <div id="canvas-container" class="absolute inset-0 w-full h-full cursor-crosshair">
        <canvas id="main-canvas"></canvas>
        <div id="selection-box" class="selection-box"></div>
    </div>
    <div id="brush-cursor"></div>
    <div id="text-editor-container" class="absolute pointer-events-none z-30" style="display:none;"></div>

    <!-- TOP BAR -->
    <header id="top-bar" class="absolute top-2 left-2 right-2 flex items-center justify-between pointer-events-none z-20 gap-2">
        <!-- Brand + Mode -->
        <div class="geist-surface px-2.5 py-1.5 rounded-lg flex items-center gap-2 pointer-events-auto">
            <div class="flex items-center gap-1.5">
                <div class="w-5 h-5 rounded bg-white text-black flex items-center justify-center text-[10px] font-semibold">▲</div>
                <span class="text-[13px] font-medium tracking-tight text-white hide-sm">Infinite<span class="text-geist-500 font-normal">Studio</span></span>
            </div>
            <div class="h-3.5 w-px bg-white/10"></div>
            <div class="mode-toggle flex">
                <button id="mode-vector-btn" class="mode-toggle-btn active flex items-center gap-1">
                    <i class="fa-solid fa-vector-square text-[9px]"></i><span>Vector</span>
                </button>
                <button id="mode-paint-btn" class="mode-toggle-btn flex items-center gap-1">
                    <i class="fa-solid fa-paintbrush text-[9px]"></i><span>Paint</span>
                </button>
            </div>
        </div>

        <!-- Center: Grid + BG -->
        <div id="center-controls" class="geist-surface px-2 py-1.5 rounded-lg flex items-center gap-1.5 pointer-events-auto">
            <button id="btn-grid-toggle" class="geist-btn px-2 py-1 rounded-md text-[11px] flex items-center gap-1.5" title="グリッド (G)">
                <i id="grid-icon" class="fa-solid fa-border-all text-[11px]"></i>
                <span id="grid-label" class="font-mono text-[10px]">Grid</span>
            </button>
            <div class="h-3.5 w-px bg-white/10"></div>
            <div class="flex items-center gap-1.5">
                <span class="text-[10px] text-geist-500 font-mono hide-sm">Bg</span>
                <button class="bg-picker w-5 h-5 rounded border border-white/20 bg-white" data-color="#ffffff" title="White"></button>
                <button class="bg-picker w-5 h-5 rounded border border-white/15 bg-[#F8F8FA]" data-color="#F8F8FA" title="Off-white"></button>
                <button class="bg-picker w-5 h-5 rounded border border-white/15 bg-[#F0F2F5]" data-color="#F0F2F5" title="Slate"></button>
                <button class="bg-picker w-5 h-5 rounded border border-white/15 bg-[#E8E8EC]" data-color="#E8E8EC" title="Light gray"></button>
                <button class="bg-picker w-5 h-5 rounded border border-white/25 bg-[#0A0A0A]" data-color="#0A0A0A" title="Dark"></button>
            </div>
        </div>

        <!-- Actions -->
        <div class="geist-surface px-1.5 py-1.5 rounded-lg flex items-center gap-0.5 pointer-events-auto">
            <button id="btn-undo" class="geist-btn rounded-md" title="元に戻す (⌘Z)" disabled>
                <i class="fa-solid fa-rotate-left text-[13px]"></i>
            </button>
            <button id="btn-redo" class="geist-btn rounded-md" title="やり直し (⌘⇧Z)" disabled>
                <i class="fa-solid fa-rotate-right text-[13px]"></i>
            </button>
            <div class="h-3.5 w-px bg-white/10 mx-0.5"></div>
            <button id="btn-clear" class="geist-btn px-2 rounded-md text-[11px] text-rose-400 hover:text-rose-300" title="全消去">
                <i class="fa-solid fa-trash-can text-[12px]"></i>
            </button>
            <div class="relative">
                <button id="btn-export" class="geist-btn px-2.5 rounded-md text-[11px] font-medium bg-white text-black hover:bg-geist-100 !text-black flex items-center gap-1.5">
                    <i class="fa-solid fa-download text-[11px]"></i><span id="export-label">書き出し</span>
                </button>
                <div id="export-menu" class="hidden absolute right-0 top-full mt-1.5 w-40 geist-surface rounded-lg py-1 z-50 text-[12px]">
                    <button data-export="png" class="w-full text-left px-3 py-2 hover:bg-white/8 flex items-center gap-2 text-geist-200">
                        <i class="fa-regular fa-image w-4"></i>PNG
                    </button>
                    <button data-export="jpeg" class="w-full text-left px-3 py-2 hover:bg-white/8 flex items-center gap-2 text-geist-200">
                        <i class="fa-regular fa-file-image w-4"></i>JPEG
                    </button>
                    <button data-export="svg" class="w-full text-left px-3 py-2 hover:bg-white/8 flex items-center gap-2 text-geist-200">
                        <i class="fa-solid fa-bezier-curve w-4"></i>SVG
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- LEFT TOOLBAR -->
    <aside id="left-toolbar" class="absolute left-2 top-1/2 -translate-y-1/2 geist-surface p-1 rounded-lg flex flex-col gap-0.5 z-20 pointer-events-auto">
        <button id="tool-hand" class="geist-btn" title="移動 (H / Space)">
            <i class="fa-solid fa-hand text-[15px]"></i>
        </button>
        <button id="tool-select" class="geist-btn" title="選択 (V)">
            <i class="fa-solid fa-arrow-pointer text-[15px]"></i>
        </button>
        <div class="h-px w-full bg-white/10 my-0.5"></div>
        <button id="tool-brush" class="geist-btn active" title="ブラシ (B)">
            <i class="fa-solid fa-pen-nib text-[15px]"></i>
        </button>
        <button id="tool-text" class="geist-btn" title="テキスト (T)">
            <i class="fa-solid fa-font text-[15px]"></i>
        </button>
        <div class="relative" id="shapes-wrap">
            <button id="tool-shapes" class="geist-btn w-full" title="図形">
                <i id="shape-icon" class="fa-regular fa-square text-[15px]"></i>
            </button>
            <div id="shapes-menu" class="absolute left-full top-0 ml-1.5 geist-surface p-1 rounded-lg hidden flex-col gap-0.5 z-30">
                <button data-shape="rect" class="geist-btn" title="四角形"><i class="fa-regular fa-square"></i></button>
                <button data-shape="circle" class="geist-btn" title="円"><i class="fa-regular fa-circle"></i></button>
                <button data-shape="line" class="geist-btn" title="直線"><i class="fa-solid fa-minus"></i></button>
                <button data-shape="arrow" class="geist-btn" title="矢印"><i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </div>
        <button id="tool-eraser" class="geist-btn" title="消しゴム (E)">
            <i class="fa-solid fa-eraser text-[15px]"></i>
        </button>
        <button id="tool-eyedropper" class="geist-btn" title="スポイト (I)">
            <i class="fa-solid fa-eye-dropper text-[15px]"></i>
        </button>
        <div class="h-px w-full bg-white/10 my-0.5"></div>
        <button id="btn-props-toggle" class="geist-btn hidden" title="プロパティ" style="display:none;">
            <i class="fa-solid fa-sliders text-[15px]"></i>
        </button>
    </aside>

    <!-- RIGHT PROPERTIES -->
    <aside id="props-panel" class="absolute right-2 top-[60px] bottom-12 w-60 geist-surface p-2.5 rounded-lg flex flex-col gap-2.5 z-20 pointer-events-auto overflow-y-auto props-scroll">
        <div class="flex justify-between items-center">
            <span class="text-[10px] font-mono uppercase tracking-wider text-geist-500">Properties</span>
            <span id="tool-badge" class="text-[10px] px-1.5 py-0.5 rounded bg-white/10 text-geist-300 font-mono">BRUSH</span>
        </div>

        <!-- Paint presets -->
        <div id="paint-presets" class="hidden flex-col gap-1.5">
            <label class="text-[11px] text-geist-400 font-medium">ペイントタイプ</label>
            <div class="grid grid-cols-3 gap-1">
                <button class="paint-preset active geist-btn py-2 rounded-md text-[10px] flex flex-col items-center gap-0.5" data-preset="pen">
                    <i class="fa-solid fa-pen text-[12px]"></i>ペン
                </button>
                <button class="paint-preset geist-btn py-2 rounded-md text-[10px] flex flex-col items-center gap-0.5" data-preset="marker">
                    <i class="fa-solid fa-highlighter text-[12px]"></i>マーカー
                </button>
                <button class="paint-preset geist-btn py-2 rounded-md text-[10px] flex flex-col items-center gap-0.5" data-preset="airbrush">
                    <i class="fa-solid fa-spray-can text-[12px]"></i>エア
                </button>
            </div>
        </div>

        <!-- Size -->
        <div class="flex flex-col gap-1">
            <div class="flex justify-between">
                <label class="text-[11px] text-geist-400">サイズ</label>
                <span id="size-val" class="text-[11px] font-mono text-white">8</span>
            </div>
            <input id="size-slider" type="range" min="1" max="120" value="8" class="slider w-full">
        </div>

        <!-- Opacity -->
        <div class="flex flex-col gap-1">
            <div class="flex justify-between">
                <label class="text-[11px] text-geist-400">不透明度</label>
                <span id="opacity-val" class="text-[11px] font-mono text-white">100%</span>
            </div>
            <input id="opacity-slider" type="range" min="5" max="100" value="100" class="slider w-full">
        </div>

        <!-- Color -->
        <div class="flex flex-col gap-2 pt-1 border-t border-white/8">
            <label class="text-[11px] text-geist-400">カラー</label>
            <div class="flex items-center gap-2">
                <div class="relative shrink-0">
                    <input id="color-input" type="color" value="#171717" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10">
                    <div id="color-swatch" class="w-9 h-9 rounded-md border border-white/15" style="background:#171717"></div>
                </div>
                <div class="flex-1 flex items-center gap-1.5 bg-black/40 px-2 py-1.5 rounded-md border border-white/8">
                    <span class="text-geist-600 text-[10px] font-mono">#</span>
                    <input id="hex-input" type="text" value="171717" maxlength="6" class="bg-transparent text-[13px] text-white font-mono outline-none w-full uppercase tracking-wide">
                </div>
            </div>

            <!-- Palettes -->
            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between items-center">
                    <span class="text-[10px] text-geist-500 font-mono">パレット</span>
                    <select id="palette-select" class="bg-black/40 border border-white/8 text-[10px] text-geist-300 rounded px-1.5 py-1 outline-none">
                        <option value="mono">Monochrome</option>
                        <option value="vercel">Vercel</option>
                        <option value="pastel">Pastel</option>
                        <option value="earth">Earth</option>
                        <option value="neon">Neon</option>
                    </select>
                </div>
                <div id="palette-grid" class="grid grid-cols-6 gap-1.5"></div>
            </div>
        </div>

        <!-- Selected object actions (vector) -->
        <div id="selection-actions" class="hidden flex-col gap-1.5 pt-1 border-t border-white/8">
            <label class="text-[11px] text-geist-400">選択中</label>
            <button id="btn-delete-selected" class="geist-btn py-2 rounded-md text-[11px] text-rose-400 hover:text-rose-300 w-full">
                <i class="fa-solid fa-trash-can mr-1.5"></i>削除
            </button>
        </div>
    </aside>

    <!-- BOTTOM HUD -->
    <footer id="bottom-hud" class="absolute bottom-2 left-2 right-2 flex items-center justify-between pointer-events-none z-20">
        <div class="geist-surface px-2.5 py-1.5 rounded-md text-[11px] font-mono text-geist-400 flex items-center gap-2 pointer-events-auto">
            <span id="hud-coords">0, 0</span>
            <div class="h-3 w-px bg-white/10"></div>
            <span id="hud-zoom" class="text-white font-medium">100%</span>
        </div>
        <div class="geist-surface px-1 py-0.5 rounded-md flex items-center gap-0.5 pointer-events-auto">
            <button id="zoom-out" class="geist-btn rounded" title="縮小"><i class="fa-solid fa-minus text-[11px]"></i></button>
            <button id="zoom-reset" class="geist-btn px-2 rounded text-[10px] font-mono" title="100%">100%</button>
            <button id="zoom-in" class="geist-btn rounded" title="拡大"><i class="fa-solid fa-plus text-[11px]"></i></button>
        </div>
        <button id="btn-help" class="geist-surface px-2.5 py-1.5 rounded-md text-[11px] font-mono text-geist-400 hover:text-white pointer-events-auto flex items-center gap-1.5">
            <i class="fa-solid fa-keyboard text-[12px]"></i>?
        </button>
    </footer>

    <!-- Shortcuts Modal -->
    <div id="help-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="geist-surface max-w-sm w-full rounded-xl p-5 shadow-menu">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-[13px] font-medium text-white flex items-center gap-2">
                    <i class="fa-solid fa-keyboard text-geist-400"></i>ショートカット
                </h3>
                <button id="close-help" class="text-geist-500 hover:text-white text-lg leading-none">&times;</button>
            </div>
            <div class="grid grid-cols-1 gap-1.5 text-[12px] font-mono">
                <div class="flex justify-between bg-white/5 px-2.5 py-1.5 rounded-md"><span class="text-geist-400">パン</span><span>Space + Drag</span></div>
                <div class="flex justify-between bg-white/5 px-2.5 py-1.5 rounded-md"><span class="text-geist-400">ズーム</span><span>Wheel / ⌘±</span></div>
                <div class="flex justify-between bg-white/5 px-2.5 py-1.5 rounded-md"><span class="text-geist-400">ブラシサイズ</span><span>Ctrl + Wheel</span></div>
                <div class="flex justify-between bg-white/5 px-2.5 py-1.5 rounded-md"><span class="text-geist-400">ブラシ / 消しゴム</span><span>B / E</span></div>
                <div class="flex justify-between bg-white/5 px-2.5 py-1.5 rounded-md"><span class="text-geist-400">選択 / テキスト</span><span>V / T</span></div>
                <div class="flex justify-between bg-white/5 px-2.5 py-1.5 rounded-md"><span class="text-geist-400">グリッド</span><span>G</span></div>
                <div class="flex justify-between bg-white/5 px-2.5 py-1.5 rounded-md"><span class="text-geist-400">Undo / Redo</span><span>⌘Z / ⌘⇧Z</span></div>
                <div class="flex justify-between bg-white/5 px-2.5 py-1.5 rounded-md"><span class="text-geist-400">削除</span><span>Delete / Backspace</span></div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // ========== STATE ==========
        const state = {
            mode: 'vector',          // vector | paint
            tool: 'brush',
            paintPreset: 'pen',
            zoom: 1,
            panX: 0,
            panY: 0,
            gridMode: 'grid',        // grid | dots | off
            canvasBg: '#ffffff',
            color: '#171717',
            strokeWidth: 8,
            opacity: 1,
            isPanning: false,
            isDrawing: false,
            isSelecting: false,
            spacePressed: false,
            lastMouse: { x: 0, y: 0 },
            startWorld: { x: 0, y: 0 },
            vectorObjects: [],
            selectedIds: new Set(),
            layers: [],              // paint offscreen canvases
            activeLayer: 0,
            undoStack: [],
            redoStack: [],
            maxHistory: 40,
            currentPath: null,
            currentShape: null,
            dpr: Math.min(window.devicePixelRatio || 1, 2)
        };

        const palettes = {
            mono:   ['#171717','#404040','#737373','#a3a3a3','#d4d4d4','#ffffff'],
            vercel: ['#171717','#0070f3','#7928ca','#ff0080','#f5a623','#50e3c2'],
            pastel: ['#2b2d42','#ef476f','#ffd166','#06d6a0','#118ab2','#f8edeb'],
            earth:  ['#1b4332','#2d6a4f','#40916c','#52b788','#74c69d','#d8f3dc'],
            neon:   ['#0a0a0a','#00f0ff','#ff00aa','#aaff00','#ff5500','#ffffff']
        };

        // DOM
        const container = document.getElementById('canvas-container');
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const brushCursor = document.getElementById('brush-cursor');
        const selectionBox = document.getElementById('selection-box');
        const textEditor = document.getElementById('text-editor-container');

        // ========== INIT LAYERS ==========
        function createLayer() {
            const c = document.createElement('canvas');
            c.width = canvas.width;
            c.height = canvas.height;
            return { canvas: c, ctx: c.getContext('2d'), visible: true };
        }

        function resize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const dpr = state.dpr;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            // resize paint layers preserving content
            state.layers.forEach(l => {
                const old = l.canvas;
                const nc = document.createElement('canvas');
                nc.width = canvas.width;
                nc.height = canvas.height;
                const nctx = nc.getContext('2d');
                nctx.drawImage(old, 0, 0);
                l.canvas = nc;
                l.ctx = nctx;
            });
            if (state.layers.length === 0) {
                state.layers.push(createLayer());
            }
            render();
        }
        window.addEventListener('resize', resize);

        // ========== HISTORY ==========
        function snapshot() {
            const paintData = state.layers.map(l => l.canvas.toDataURL('image/png'));
            return JSON.stringify({
                vectors: state.vectorObjects,
                paint: paintData,
                selected: [...state.selectedIds]
            });
        }

        function restore(snap) {
            const data = JSON.parse(snap);
            state.vectorObjects = data.vectors || [];
            state.selectedIds = new Set(data.selected || []);
            // restore paint
            data.paint.forEach((url, i) => {
                if (!state.layers[i]) state.layers[i] = createLayer();
                const img = new Image();
                img.onload = () => {
                    state.layers[i].ctx.clearRect(0, 0, state.layers[i].canvas.width, state.layers[i].canvas.height);
                    state.layers[i].ctx.drawImage(img, 0, 0);
                    render();
                };
                img.src = url;
            });
            updateHistoryButtons();
            updateSelectionUI();
            render();
        }

        function pushHistory() {
            state.undoStack.push(snapshot());
            if (state.undoStack.length > state.maxHistory) state.undoStack.shift();
            state.redoStack = [];
            updateHistoryButtons();
        }

        function undo() {
            if (state.undoStack.length === 0) return;
            state.redoStack.push(snapshot());
            restore(state.undoStack.pop());
        }

        function redo() {
            if (state.redoStack.length === 0) return;
            state.undoStack.push(snapshot());
            restore(state.redoStack.pop());
        }

        function updateHistoryButtons() {
            document.getElementById('btn-undo').disabled = state.undoStack.length === 0;
            document.getElementById('btn-redo').disabled = state.redoStack.length === 0;
            document.getElementById('btn-undo').style.opacity = state.undoStack.length ? '1' : '0.35';
            document.getElementById('btn-redo').style.opacity = state.redoStack.length ? '1' : '0.35';
        }

        // ========== COORD ==========
        function screenToWorld(sx, sy) {
            return {
                x: (sx - state.panX) / state.zoom,
                y: (sy - state.panY) / state.zoom
            };
        }
        function worldToScreen(wx, wy) {
            return {
                x: wx * state.zoom + state.panX,
                y: wy * state.zoom + state.panY
            };
        }

        // ========== RENDER ==========
        function drawGrid() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            ctx.fillStyle = state.canvasBg;
            ctx.fillRect(0, 0, w, h);

            if (state.gridMode === 'off') return;

            const step = 40 * state.zoom;
            const ox = state.panX % step;
            const oy = state.panY % step;
            const dark = state.canvasBg === '#0A0A0A';

            ctx.strokeStyle = dark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.06)';
            ctx.fillStyle = dark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.12)';
            ctx.lineWidth = 1;

            if (state.gridMode === 'grid') {
                ctx.beginPath();
                for (let x = ox; x < w; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
                for (let y = oy; y < h; y += step) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
                ctx.stroke();
            } else {
                const r = Math.min(1.3 * state.zoom, 1.8);
                for (let x = ox; x < w; x += step) {
                    for (let y = oy; y < h; y += step) {
                        ctx.beginPath();
                        ctx.arc(x, y, r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
        }

        function drawVector(obj) {
            ctx.save();
            ctx.strokeStyle = obj.color;
            ctx.fillStyle = obj.color;
            ctx.lineWidth = obj.strokeWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.globalAlpha = obj.opacity ?? 1;
            const selected = state.selectedIds.has(obj.id);

            if (obj.type === 'path' && obj.points.length) {
                ctx.beginPath();
                ctx.moveTo(obj.points[0].x, obj.points[0].y);
                for (let i = 1; i < obj.points.length; i++) ctx.lineTo(obj.points[i].x, obj.points[i].y);
                ctx.stroke();
            } else if (obj.type === 'rect') {
                ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
                if (selected) {
                    ctx.strokeStyle = '#0070f3';
                    ctx.lineWidth = 1 / state.zoom;
                    ctx.setLineDash([4 / state.zoom, 3 / state.zoom]);
                    ctx.strokeRect(obj.x - 2, obj.y - 2, obj.w + 4, obj.h + 4);
                }
            } else if (obj.type === 'circle') {
                const r = Math.hypot(obj.w, obj.h);
                ctx.beginPath();
                ctx.arc(obj.x, obj.y, r, 0, Math.PI * 2);
                ctx.stroke();
                if (selected) {
                    ctx.strokeStyle = '#0070f3';
                    ctx.lineWidth = 1 / state.zoom;
                    ctx.setLineDash([4 / state.zoom, 3 / state.zoom]);
                    ctx.beginPath();
                    ctx.arc(obj.x, obj.y, r + 3, 0, Math.PI * 2);
                    ctx.stroke();
                }
            } else if (obj.type === 'line' || obj.type === 'arrow') {
                ctx.beginPath();
                ctx.moveTo(obj.x1, obj.y1);
                ctx.lineTo(obj.x2, obj.y2);
                ctx.stroke();
                if (obj.type === 'arrow') {
                    const angle = Math.atan2(obj.y2 - obj.y1, obj.x2 - obj.x1);
                    const head = Math.max(10, obj.strokeWidth * 2.2);
                    ctx.beginPath();
                    ctx.moveTo(obj.x2, obj.y2);
                    ctx.lineTo(obj.x2 - head * Math.cos(angle - 0.4), obj.y2 - head * Math.sin(angle - 0.4));
                    ctx.moveTo(obj.x2, obj.y2);
                    ctx.lineTo(obj.x2 - head * Math.cos(angle + 0.4), obj.y2 - head * Math.sin(angle + 0.4));
                    ctx.stroke();
                }
            } else if (obj.type === 'text') {
                ctx.font = `${obj.fontSize || 22}px Inter, system-ui, sans-serif`;
                ctx.fillText(obj.text, obj.x, obj.y);
                if (selected) {
                    const m = ctx.measureText(obj.text);
                    ctx.strokeStyle = '#0070f3';
                    ctx.lineWidth = 1 / state.zoom;
                    ctx.setLineDash([3 / state.zoom, 2 / state.zoom]);
                    ctx.strokeRect(obj.x - 2, obj.y - (obj.fontSize || 22), m.width + 4, (obj.fontSize || 22) + 4);
                }
            }
            ctx.restore();
        }

        function render() {
            drawGrid();
            ctx.save();
            ctx.translate(state.panX, state.panY);
            ctx.scale(state.zoom, state.zoom);

            // paint layers
            state.layers.forEach(l => {
                if (l.visible) ctx.drawImage(l.canvas, 0, 0, l.canvas.width / state.dpr, l.canvas.height / state.dpr);
            });

            // vectors
            state.vectorObjects.forEach(drawVector);

            ctx.restore();
            document.getElementById('hud-zoom').textContent = Math.round(state.zoom * 100) + '%';
        }

        // ========== TOOLS ==========
        function setTool(name) {
            state.tool = name;
            document.querySelectorAll('[id^="tool-"]').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('tool-' + (['rect','circle','line','arrow'].includes(name) ? 'shapes' : name));
            if (btn) btn.classList.add('active');
            document.getElementById('tool-badge').textContent = name.toUpperCase();
            container.style.cursor = name === 'hand' ? 'grab' : (name === 'text' ? 'text' : 'crosshair');
            if (['rect','circle','line','arrow'].includes(name)) {
                const icons = { rect: 'fa-regular fa-square', circle: 'fa-regular fa-circle', line: 'fa-solid fa-minus', arrow: 'fa-solid fa-arrow-right' };
                document.getElementById('shape-icon').className = icons[name] + ' text-[14px]';
            }
            updateCursor();
        }

        function setMode(m) {
            state.mode = m;
            document.getElementById('mode-vector-btn').classList.toggle('active', m === 'vector');
            document.getElementById('mode-paint-btn').classList.toggle('active', m === 'paint');
            document.getElementById('paint-presets').classList.toggle('hidden', m !== 'paint');
            document.getElementById('paint-presets').classList.toggle('flex', m === 'paint');
            render();
        }

        // Color
        function setColor(hex) {
            if (!hex.startsWith('#')) hex = '#' + hex;
            if (!/^#[0-9A-Fa-f]{6}$/.test(hex)) return;
            state.color = hex.toLowerCase();
            document.getElementById('color-input').value = hex;
            document.getElementById('color-swatch').style.background = hex;
            document.getElementById('hex-input').value = hex.slice(1).toUpperCase();
            document.querySelectorAll('.swatch').forEach(s => {
                s.classList.toggle('active', s.dataset.hex === hex.toLowerCase());
            });
        }

        function renderPalette(name) {
            const grid = document.getElementById('palette-grid');
            grid.innerHTML = '';
            (palettes[name] || palettes.mono).forEach(hex => {
                const b = document.createElement('button');
                b.className = 'swatch' + (hex.toLowerCase() === state.color ? ' active' : '');
                b.style.background = hex;
                b.dataset.hex = hex.toLowerCase();
                b.addEventListener('click', () => setColor(hex));
                grid.appendChild(b);
            });
        }

        // ========== INTERACTION ==========
        function getPos(e) {
            const r = canvas.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
        }

        container.addEventListener('pointerdown', (e) => {
            if (e.button === 2) return;
            container.setPointerCapture(e.pointerId);
            const pos = getPos(e);
            const world = screenToWorld(pos.x, pos.y);
            state.lastMouse = pos;
            state.startWorld = world;

            if (state.tool === 'hand' || state.spacePressed || e.button === 1) {
                state.isPanning = true;
                container.style.cursor = 'grabbing';
                return;
            }

            if (state.tool === 'eyedropper') {
                // sample from rendered canvas (approx)
                const px = ctx.getImageData(pos.x * state.dpr, pos.y * state.dpr, 1, 1).data;
                const hex = '#' + [px[0], px[1], px[2]].map(v => v.toString(16).padStart(2, '0')).join('');
                setColor(hex);
                setTool('brush');
                return;
            }

            if (state.tool === 'text') {
                spawnText(world.x, world.y);
                return;
            }

            if (state.tool === 'select') {
                // hit test simple
                let hit = null;
                for (let i = state.vectorObjects.length - 1; i >= 0; i--) {
                    const o = state.vectorObjects[i];
                    if (hitTest(o, world.x, world.y)) { hit = o; break; }
                }
                if (e.shiftKey) {
                    if (hit) {
                        if (state.selectedIds.has(hit.id)) state.selectedIds.delete(hit.id);
                        else state.selectedIds.add(hit.id);
                    }
                } else {
                    state.selectedIds.clear();
                    if (hit) state.selectedIds.add(hit.id);
                }
                updateSelectionUI();
                render();
                return;
            }

            state.isDrawing = true;

            if (state.mode === 'vector') {
                if (state.tool === 'brush') {
                    state.currentPath = {
                        id: crypto.randomUUID(),
                        type: 'path',
                        color: state.color,
                        strokeWidth: state.strokeWidth,
                        opacity: state.opacity,
                        points: [{ x: world.x, y: world.y }]
                    };
                    state.vectorObjects.push(state.currentPath);
                } else if (['rect', 'circle'].includes(state.tool)) {
                    state.currentShape = {
                        id: crypto.randomUUID(),
                        type: state.tool,
                        x: world.x, y: world.y, w: 0, h: 0,
                        color: state.color, strokeWidth: state.strokeWidth, opacity: state.opacity
                    };
                    state.vectorObjects.push(state.currentShape);
                } else if (['line', 'arrow'].includes(state.tool)) {
                    state.currentShape = {
                        id: crypto.randomUUID(),
                        type: state.tool,
                        x1: world.x, y1: world.y, x2: world.x, y2: world.y,
                        color: state.color, strokeWidth: state.strokeWidth, opacity: state.opacity
                    };
                    state.vectorObjects.push(state.currentShape);
                }
            } else {
                // paint
                const layer = state.layers[state.activeLayer];
                const lctx = layer.ctx;
                lctx.save();
                // map world to layer pixels (layer is full res)
                const lx = world.x * state.dpr;
                const ly = world.y * state.dpr;
                lctx.strokeStyle = state.color;
                lctx.lineWidth = state.strokeWidth * state.dpr;
                lctx.lineCap = 'round';
                lctx.lineJoin = 'round';
                lctx.globalAlpha = state.paintPreset === 'marker' ? state.opacity * 0.55 : state.opacity;
                lctx.globalCompositeOperation = state.tool === 'eraser' ? 'destination-out' : 'source-over';
                if (state.paintPreset === 'airbrush') {
                    lctx.shadowBlur = state.strokeWidth * 0.6 * state.dpr;
                    lctx.shadowColor = state.color;
                }
                lctx.beginPath();
                lctx.moveTo(lx, ly);
                state._lastPaint = { x: lx, y: ly };
            }
            render();
        });

        container.addEventListener('pointermove', (e) => {
            const pos = getPos(e);
            const world = screenToWorld(pos.x, pos.y);
            document.getElementById('hud-coords').textContent = `${Math.round(world.x)}, ${Math.round(world.y)}`;
            updateCursor(pos.x, pos.y);

            if (state.isPanning) {
                state.panX += pos.x - state.lastMouse.x;
                state.panY += pos.y - state.lastMouse.y;
                state.lastMouse = pos;
                render();
                return;
            }

            if (!state.isDrawing) return;

            if (state.mode === 'vector') {
                if (state.currentPath) {
                    state.currentPath.points.push({ x: world.x, y: world.y });
                    render();
                } else if (state.currentShape) {
                    if (['rect', 'circle'].includes(state.currentShape.type)) {
                        state.currentShape.w = world.x - state.startWorld.x;
                        state.currentShape.h = world.y - state.startWorld.y;
                    } else {
                        state.currentShape.x2 = world.x;
                        state.currentShape.y2 = world.y;
                    }
                    render();
                }
            } else {
                const layer = state.layers[state.activeLayer];
                const lctx = layer.ctx;
                const lx = world.x * state.dpr;
                const ly = world.y * state.dpr;
                lctx.lineTo(lx, ly);
                lctx.stroke();
                lctx.beginPath();
                lctx.moveTo(lx, ly);
                render();
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (state.isPanning) {
                state.isPanning = false;
                container.style.cursor = state.tool === 'hand' ? 'grab' : 'crosshair';
            }
            if (state.isDrawing) {
                state.isDrawing = false;
                if (state.mode === 'paint') {
                    const layer = state.layers[state.activeLayer];
                    layer.ctx.restore();
                    layer.ctx.shadowBlur = 0;
                }
                pushHistory();
            }
            state.currentPath = null;
            state.currentShape = null;
        });

        // Zoom / size
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.ctrlKey || e.metaKey) {
                const d = e.deltaY < 0 ? 2 : -2;
                state.strokeWidth = Math.max(1, Math.min(120, state.strokeWidth + d));
                document.getElementById('size-slider').value = state.strokeWidth;
                document.getElementById('size-val').textContent = state.strokeWidth;
                updateCursor();
                return;
            }
            const factor = e.deltaY < 0 ? 1.09 : 1 / 1.09;
            const mx = e.clientX, my = e.clientY;
            const before = screenToWorld(mx, my);
            state.zoom = Math.min(16, Math.max(0.08, state.zoom * factor));
            const after = screenToWorld(mx, my);
            state.panX += (after.x - before.x) * state.zoom;
            state.panY += (after.y - before.y) * state.zoom;
            render();
        }, { passive: false });

        function updateCursor(x, y) {
            if (x === undefined) { x = state.lastMouse.x; y = state.lastMouse.y; }
            if (['brush', 'eraser'].includes(state.tool)) {
                brushCursor.style.display = 'block';
                const r = state.strokeWidth * state.zoom;
                brushCursor.style.width = r + 'px';
                brushCursor.style.height = r + 'px';
                brushCursor.style.left = x + 'px';
                brushCursor.style.top = y + 'px';
            } else {
                brushCursor.style.display = 'none';
            }
        }

        // Hit test (simple)
        function hitTest(obj, x, y) {
            const tol = Math.max(6, (obj.strokeWidth || 4) / 2 + 4);
            if (obj.type === 'path') {
                for (let i = 1; i < obj.points.length; i++) {
                    const a = obj.points[i-1], b = obj.points[i];
                    const d = distToSegment(x, y, a.x, a.y, b.x, b.y);
                    if (d < tol) return true;
                }
            } else if (obj.type === 'rect') {
                const minX = Math.min(obj.x, obj.x + obj.w), maxX = Math.max(obj.x, obj.x + obj.w);
                const minY = Math.min(obj.y, obj.y + obj.h), maxY = Math.max(obj.y, obj.y + obj.h);
                return x >= minX - tol && x <= maxX + tol && y >= minY - tol && y <= maxY + tol;
            } else if (obj.type === 'circle') {
                return Math.hypot(x - obj.x, y - obj.y) <= Math.hypot(obj.w, obj.h) + tol;
            } else if (obj.type === 'line' || obj.type === 'arrow') {
                return distToSegment(x, y, obj.x1, obj.y1, obj.x2, obj.y2) < tol;
            } else if (obj.type === 'text') {
                return Math.abs(x - obj.x) < 80 && Math.abs(y - obj.y) < (obj.fontSize || 22);
            }
            return false;
        }
        function distToSegment(px, py, x1, y1, x2, y2) {
            const dx = x2 - x1, dy = y2 - y1;
            const len = Math.hypot(dx, dy) || 1;
            const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / (len * len)));
            return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
        }

        function updateSelectionUI() {
            const el = document.getElementById('selection-actions');
            el.classList.toggle('hidden', state.selectedIds.size === 0);
            el.classList.toggle('flex', state.selectedIds.size > 0);
        }

        // Text
        function spawnText(wx, wy) {
            const sp = worldToScreen(wx, wy);
            textEditor.style.display = 'block';
            textEditor.style.left = sp.x + 'px';
            textEditor.style.top = sp.y + 'px';
            textEditor.style.pointerEvents = 'auto';
            const ta = document.createElement('textarea');
            ta.className = 'text-editor-input';
            ta.style.color = state.color;
            ta.style.fontSize = Math.max(14, 22 * state.zoom) + 'px';
            ta.placeholder = 'テキスト…';
            ta.rows = 1;
            textEditor.innerHTML = '';
            textEditor.appendChild(ta);
            ta.focus();
            const commit = () => {
                const v = ta.value.trim();
                if (v) {
                    state.vectorObjects.push({
                        id: crypto.randomUUID(),
                        type: 'text',
                        text: v,
                        x: wx, y: wy,
                        color: state.color,
                        fontSize: 22,
                        opacity: state.opacity
                    });
                    pushHistory();
                    render();
                }
                textEditor.style.display = 'none';
                textEditor.style.pointerEvents = 'none';
            };
            ta.addEventListener('blur', commit);
            ta.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ta.blur(); }
                if (e.key === 'Escape') { ta.value = ''; ta.blur(); }
            });
        }

        // ========== UI BINDINGS ==========
        document.getElementById('mode-vector-btn').onclick = () => setMode('vector');
        document.getElementById('mode-paint-btn').onclick = () => setMode('paint');

        ['hand','select','brush','text','eraser','eyedropper'].forEach(t => {
            document.getElementById('tool-' + t).onclick = () => setTool(t);
        });
        // Shapes menu (touch-friendly)
        const shapesBtn = document.getElementById('tool-shapes');
        const shapesMenu = document.getElementById('shapes-menu');
        shapesBtn.onclick = (e) => {
            e.stopPropagation();
            shapesMenu.classList.toggle('hidden');
            shapesMenu.classList.toggle('flex');
        };
        document.querySelectorAll('[data-shape]').forEach(b => {
            b.onclick = (e) => {
                e.stopPropagation();
                setTool(b.dataset.shape);
                shapesMenu.classList.add('hidden');
                shapesMenu.classList.remove('flex');
            };
        });
        document.addEventListener('click', () => {
            shapesMenu.classList.add('hidden');
            shapesMenu.classList.remove('flex');
        });

        document.querySelectorAll('.paint-preset').forEach(b => {
            b.onclick = () => {
                document.querySelectorAll('.paint-preset').forEach(x => x.classList.remove('active'));
                b.classList.add('active');
                state.paintPreset = b.dataset.preset;
            };
        });

        document.getElementById('size-slider').oninput = (e) => {
            state.strokeWidth = +e.target.value;
            document.getElementById('size-val').textContent = state.strokeWidth;
            updateCursor();
        };
        document.getElementById('opacity-slider').oninput = (e) => {
            state.opacity = e.target.value / 100;
            document.getElementById('opacity-val').textContent = e.target.value + '%';
        };

        document.getElementById('color-input').oninput = (e) => setColor(e.target.value);
        document.getElementById('hex-input').onchange = (e) => setColor(e.target.value);
        document.getElementById('palette-select').onchange = (e) => renderPalette(e.target.value);

        document.querySelectorAll('.bg-picker').forEach(b => {
            b.onclick = () => { state.canvasBg = b.dataset.color; render(); };
        });

        document.getElementById('btn-grid-toggle').onclick = () => {
            state.gridMode = state.gridMode === 'grid' ? 'dots' : state.gridMode === 'dots' ? 'off' : 'grid';
            document.getElementById('grid-label').textContent = state.gridMode === 'off' ? 'Off' : state.gridMode === 'dots' ? 'Dots' : 'Grid';
            render();
        };

        document.getElementById('btn-undo').onclick = undo;
        document.getElementById('btn-redo').onclick = redo;
        document.getElementById('btn-clear').onclick = () => {
            if (confirm('キャンバスの内容をすべて消去しますか？')) {
                state.vectorObjects = [];
                state.selectedIds.clear();
                state.layers.forEach(l => l.ctx.clearRect(0, 0, l.canvas.width, l.canvas.height));
                pushHistory();
                updateSelectionUI();
                render();
            }
        };
        document.getElementById('btn-delete-selected').onclick = () => {
            if (state.selectedIds.size === 0) return;
            state.vectorObjects = state.vectorObjects.filter(o => !state.selectedIds.has(o.id));
            state.selectedIds.clear();
            pushHistory();
            updateSelectionUI();
            render();
        };

        // Export
        const exportBtn = document.getElementById('btn-export');
        const exportMenu = document.getElementById('export-menu');
        exportBtn.onclick = (e) => { e.stopPropagation(); exportMenu.classList.toggle('hidden'); };
        document.addEventListener('click', () => exportMenu.classList.add('hidden'));
        document.querySelectorAll('[data-export]').forEach(b => {
            b.onclick = () => {
                const type = b.dataset.export;
                if (type === 'svg') {
                    exportSVG();
                } else {
                    // flatten to image
                    const tmp = document.createElement('canvas');
                    tmp.width = canvas.width;
                    tmp.height = canvas.height;
                    const tctx = tmp.getContext('2d');
                    tctx.fillStyle = state.canvasBg;
                    tctx.fillRect(0, 0, tmp.width, tmp.height);
                    tctx.drawImage(canvas, 0, 0);
                    const link = document.createElement('a');
                    link.download = `infinite-studio.${type === 'jpeg' ? 'jpg' : 'png'}`;
                    link.href = tmp.toDataURL(type === 'jpeg' ? 'image/jpeg' : 'image/png', 0.92);
                    link.click();
                }
            };
        });

        function exportSVG() {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            state.vectorObjects.forEach(o => {
                if (o.type === 'path') o.points.forEach(p => { minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y); });
                if (o.type === 'rect') { minX=Math.min(minX,o.x,o.x+o.w); minY=Math.min(minY,o.y,o.y+o.h); maxX=Math.max(maxX,o.x,o.x+o.w); maxY=Math.max(maxY,o.y,o.y+o.h); }
                if (o.type === 'circle') { const r=Math.hypot(o.w,o.h); minX=Math.min(minX,o.x-r); minY=Math.min(minY,o.y-r); maxX=Math.max(maxX,o.x+r); maxY=Math.max(maxY,o.y+r); }
                if (o.type === 'line' || o.type === 'arrow') { minX=Math.min(minX,o.x1,o.x2); minY=Math.min(minY,o.y1,o.y2); maxX=Math.max(maxX,o.x1,o.x2); maxY=Math.max(maxY,o.y1,o.y2); }
                if (o.type === 'text') { minX=Math.min(minX,o.x); minY=Math.min(minY,o.y-20); maxX=Math.max(maxX,o.x+100); maxY=Math.max(maxY,o.y); }
            });
            if (!isFinite(minX)) { minX=0; minY=0; maxX=800; maxY=600; }
            const pad = 20;
            minX -= pad; minY -= pad; maxX += pad; maxY += pad;
            let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${maxX-minX}" height="${maxY-minY}" viewBox="${minX} ${minY} ${maxX-minX} ${maxY-minY}">`;
            svg += `<rect x="${minX}" y="${minY}" width="${maxX-minX}" height="${maxY-minY}" fill="${state.canvasBg}"/>`;
            state.vectorObjects.forEach(o => {
                const op = o.opacity ?? 1;
                if (o.type === 'path' && o.points.length) {
                    const d = o.points.map((p,i) => (i?'L':'M') + p.x + ',' + p.y).join(' ');
                    svg += `<path d="${d}" fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"/>`;
                } else if (o.type === 'rect') {
                    svg += `<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" opacity="${op}"/>`;
                } else if (o.type === 'circle') {
                    const r = Math.hypot(o.w, o.h);
                    svg += `<circle cx="${o.x}" cy="${o.y}" r="${r}" fill="none" stroke="${o.color}" stroke-width="${o.strokeWidth}" opacity="${op}"/>`;
                } else if (o.type === 'line') {
                    svg += `<line x1="${o.x1}" y1="${o.y1}" x2="${o.x2}" y2="${o.y2}" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" opacity="${op}"/>`;
                } else if (o.type === 'arrow') {
                    svg += `<line x1="${o.x1}" y1="${o.y1}" x2="${o.x2}" y2="${o.y2}" stroke="${o.color}" stroke-width="${o.strokeWidth}" stroke-linecap="round" opacity="${op}"/>`;
                } else if (o.type === 'text') {
                    svg += `<text x="${o.x}" y="${o.y}" fill="${o.color}" font-size="${o.fontSize||22}" font-family="Inter,system-ui,sans-serif" opacity="${op}">${o.text.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</text>`;
                }
            });
            svg += '</svg>';
            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const link = document.createElement('a');
            link.download = 'infinite-studio.svg';
            link.href = URL.createObjectURL(blob);
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // Zoom buttons
        document.getElementById('zoom-in').onclick = () => { state.zoom = Math.min(16, state.zoom * 1.2); render(); };
        document.getElementById('zoom-out').onclick = () => { state.zoom = Math.max(0.08, state.zoom / 1.2); render(); };
        document.getElementById('zoom-reset').onclick = () => { state.zoom = 1; state.panX = 0; state.panY = 0; render(); };

        // Help
        document.getElementById('btn-help').onclick = () => document.getElementById('help-modal').classList.remove('hidden');
        document.getElementById('close-help').onclick = () => document.getElementById('help-modal').classList.add('hidden');
        document.getElementById('help-modal').onclick = (e) => { if (e.target.id === 'help-modal') e.target.classList.add('hidden'); };

        // Keyboard
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.code === 'Space') { state.spacePressed = true; container.style.cursor = 'grab'; e.preventDefault(); }
            if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
            if ((e.metaKey || e.ctrlKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
            if (e.key === 'g' || e.key === 'G') document.getElementById('btn-grid-toggle').click();
            if (e.key === 'b' || e.key === 'B') setTool('brush');
            if (e.key === 'e' || e.key === 'E') setTool('eraser');
            if (e.key === 't' || e.key === 'T') setTool('text');
            if (e.key === 'v' || e.key === 'V') setTool('select');
            if (e.key === 'h' || e.key === 'H') setTool('hand');
            if (e.key === 'i' || e.key === 'I') setTool('eyedropper');
            if ((e.key === 'Delete' || e.key === 'Backspace') && state.selectedIds.size) {
                document.getElementById('btn-delete-selected').click();
            }
            if (e.key === '?' || (e.shiftKey && e.key === '/')) document.getElementById('help-modal').classList.remove('hidden');
            if (e.key === 'Escape') {
                state.selectedIds.clear();
                updateSelectionUI();
                render();
                document.getElementById('help-modal').classList.add('hidden');
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                state.spacePressed = false;
                container.style.cursor = state.tool === 'hand' ? 'grab' : 'crosshair';
            }
        });

        // Props panel toggle (mobile)
        const propsPanel = document.getElementById('props-panel');
        const propsToggle = document.getElementById('btn-props-toggle');
        propsToggle.onclick = (e) => {
            e.stopPropagation();
            propsPanel.classList.toggle('open');
        };
        // Close props when tapping canvas on mobile
        container.addEventListener('pointerdown', () => {
            if (window.innerWidth <= 768) propsPanel.classList.remove('open');
        });

        // Init
        renderPalette('mono');
        setColor('#171717');
        resize();
        pushHistory(); // initial empty state
        updateHistoryButtons();
    });
    </script>
</body>
</html>
