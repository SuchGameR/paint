<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VersePaint Engine</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#2b2b2b; touch-action:none; overscroll-behavior:none; }
    body.engine-embedded #start-screen,
    body.engine-embedded #app-menubar,
    body.engine-embedded #top-bar,
    body.engine-embedded #left-toolbar,
    body.engine-embedded #left-paint-panel,
    body.engine-embedded #compact-tools,
    body.engine-embedded #anim-bar,
    body.engine-embedded #status-bar,
    body.engine-embedded .skip-link,
    body.engine-embedded #mode-anim-btn,
    body.engine-embedded #hud-coords {
      display: none !important;
      pointer-events: none !important;
    }
    body.engine-embedded [id*="right-panel"],
    body.engine-embedded .side-panel,
    body.engine-embedded #props-drawer,
    body.engine-embedded #side-tabs {
      display: none !important;
    }
    body.engine-embedded #canvas-container {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important; height: 100% !important;
      margin: 0 !important; border: none !important;
      touch-action: none !important;
    }
  </style>
</head>
<body>
<script>
(function () {
  var COMMIT = 'b75c9d3f0edba50ede086bf80eb23ef35a83199e';
  var base = 'https://cdn.jsdelivr.net/gh/SuchGameR/paint@' + COMMIT + '/';
  var urls = [
    base + 'index.html',
    'https://raw.githubusercontent.com/SuchGameR/paint/' + COMMIT + '/index.html'
  ];

  function rewriteIndex(html) {
    html = html.split('href="./').join('href="' + base);
    html = html.split('src="./').join('src="' + base);
    html = html.split('href="css/').join('href="' + base + 'css/');
    html = html.split('src="js/').join('src="' + base + 'js/');
    html = html.replace('<body', '<body class="engine-embedded"');
    html = html.replace('id="start-screen"', 'id="start-screen" style="display:none!important"');

    if (html.indexOf('viewport') >= 0) {
      html = html.replace(
        /<meta name="viewport"[^>]*>/,
        '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">'
      );
    }

    var a = html.indexOf('id="mode-anim-btn"');
    if (a >= 0) {
      var b0 = html.lastIndexOf('<button', a);
      var b1 = html.indexOf('</button>', a);
      if (b0 >= 0 && b1 >= 0) html = html.slice(0, b0) + html.slice(b1 + 9);
    }

    html = html.replace(
      /<script src="[^"]*js\/main\.js"><\/script>/,
      '<script src="' + base + 'js/main.js" id="vp-main-src" data-vp-patch="1"><\/script>' +
      '<script>(function(){var s=document.getElementById("vp-main-src");if(!s)return;s.remove();' +
      'fetch("' + base + 'js/main.js",{cache:"force-cache"}).then(function(r){return r.text()}).then(function(js){' +
      'js=js.replace("const state = window.VersePaintState.createInitialState(window.devicePixelRatio);",' +
      '"const state = window.__VP_STATE = window.VersePaintState.createInitialState(window.devicePixelRatio); if(state){state.pressureEnabled=true;if(state.pressureMin==null)state.pressureMin=0.2;}");' +
      'js=js.replace("function render() {","function render() { window.__VP_RENDER = render;");' +
      'var el=document.createElement("script");el.textContent=js;document.body.appendChild(el);' +
      '}).catch(function(e){console.error(e);var f=document.createElement("script");f.src="' + base + 'js/main.js";document.body.appendChild(f);});})();<\/script>'
    );

    var bridge = '<script src="./js/draw-engine-bridge.js"><\/script>';
    if (html.indexOf('</body>') >= 0) html = html.replace('</body>', bridge + '</body>');
    return html;
  }

  function tryLoad(i) {
    if (i >= urls.length) {
      document.body.innerHTML = '<p style="color:#f88;padding:24px;font:14px system-ui">描画エンジンの読み込みに失敗しました。</p>';
      return;
    }
    fetch(urls[i], { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (html) {
        document.open();
        document.write(rewriteIndex(html));
        document.close();
      })
      .catch(function (e) {
        console.warn(urls[i], e);
        tryLoad(i + 1);
      });
  }
  tryLoad(0);
})();
</script>
</body>
</html>
