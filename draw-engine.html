<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VersePaint Engine</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#2a2a2a; }
    body.engine-embedded #app-menubar,
    body.engine-embedded #top-bar,
    body.engine-embedded #left-toolbar,
    body.engine-embedded #left-paint-panel,
    body.engine-embedded #compact-tools,
    body.engine-embedded #anim-bar,
    body.engine-embedded #status-bar,
    body.engine-embedded .skip-link,
    body.engine-embedded #start-screen {
      display: none !important;
    }
    body.engine-embedded #canvas-container {
      position: fixed !important;
      inset: 0 !important;
      left: 0 !important;
      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
<script>
(function () {
  var commit = 'b75c9d3f0edba50ede086bf80eb23ef35a83199e';
  var base = 'https://cdn.jsdelivr.net/gh/SuchGameR/paint@' + commit + '/';
  var urls = [base + 'index.html', 'https://raw.githubusercontent.com/SuchGameR/paint/' + commit + '/index.html'];

  function rewrite(html) {
    html = html.split('href="./').join('href="' + base);
    html = html.split('src="./').join('src="' + base);
    html = html.split('href="css/').join('href="' + base + 'css/');
    html = html.split('src="js/').join('src="' + base + 'js/');
    html = html.replace('id="start-screen"', 'id="start-screen" style="display:none!important"');
    html = html.replace('<body', '<body class="engine-embedded"');
    var a = html.indexOf('id="mode-anim-btn"');
    if (a >= 0) {
      var b0 = html.lastIndexOf('<button', a);
      var b1 = html.indexOf('</button>', a);
      if (b0 >= 0 && b1 >= 0) html = html.slice(0, b0) + html.slice(b1 + 9);
    }
    var bridge = '<script src="./js/draw-engine-bridge.js"><' + '/script>';
    if (html.indexOf('</body>') >= 0) html = html.replace('</body>', bridge + '</body>');
    return html;
  }

  function tryLoad(i) {
    if (i >= urls.length) {
      document.body.innerHTML = '<p style="color:#f88;padding:20px">エンジンの読み込みに失敗しました</p>';
      return;
    }
    fetch(urls[i], { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (html) {
        document.open();
        document.write(rewrite(html));
        document.close();
        setTimeout(function () {
          document.body.classList.add('engine-embedded');
          var btn = document.getElementById('btn-start-create');
          if (btn) btn.click();
          var ss = document.getElementById('start-screen');
          if (ss) ss.style.display = 'none';
        }, 400);
      })
      .catch(function (e) { console.warn(urls[i], e); tryLoad(i + 1); });
  }
  tryLoad(0);
})();
</script>
</body>
</html>
